<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gero Mini</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <!-- media="all" (Vite's documented escape hatch, vitejs/vite#6748) stops Vite's HTML transform
       from merging this stylesheet into the app's own bundled CSS at build time. It still gets
       emitted as its own hashless asset (extension/assets/gero-swap.css) with the href rewritten
       accordingly; scripts/prepare.ts's Windows path-fixup normalizes that reference correctly for
       both entry points. The vendor copy under extension/vendor/gero-swap/ remains the source of
       truth on disk (and the loader script below is served from there), but this <link> ends up
       pointing at the Vite-emitted copy in extension/assets/ instead of /vendor/gero-swap/. -->
  <link rel="stylesheet" href="/vendor/gero-swap/gero-swap.css" media="all" />
  <script src="/vendor/gero-swap/gero-swap.js"></script>
</head>
<body>
<div id="app"></div>
<script type="module" src="./main.ts"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100%;
    background: #0a0a0a;
  }
  #app {
    height: 100%;
  }
  .v-application {
    font-family: 'Inter', sans-serif;
  }
  ::-webkit-scrollbar {
    width: 4px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: #383838;
    border-radius: 30px;
  }
  .geroButton {
    background: linear-gradient(45deg, var(--chain-gradient1, #00c7f3), var(--chain-gradient2, #00ffd1)) !important;
    color: black !important;
  }
  .geroButton:disabled {
    filter: brightness(0.5);
    color: black !important;
  }
</style>
</body>
</html>
