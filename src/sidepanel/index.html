<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gero Mini</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
<div id="app"></div>
<script type="module" src="./main.ts"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100%;
    background: #0a0a0a;
  }
  #app {
    height: 100%;
  }
  .v-application {
    font-family: 'Inter', sans-serif;
  }
  ::-webkit-scrollbar {
    width: 4px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: #383838;
    border-radius: 30px;
  }
  .geroButton {
    background: linear-gradient(45deg, var(--chain-gradient1, #00c7f3), var(--chain-gradient2, #00ffd1)) !important;
    color: black !important;
  }
  /* Vuetify's own .v-btn--disabled already blocks pointer events (the click
     handler genuinely can't fire), but a "blocked for your safety" state
     must ALSO look unmistakably non-interactive — a subtle brightness dip
     against a bright gradient isn't enough. Grey it out and desaturate. */
  .geroButton:disabled,
  .geroButton.v-btn--disabled {
    background: rgba(255, 255, 255, 0.12) !important;
    color: rgba(255, 255, 255, 0.3) !important;
    filter: grayscale(1);
  }
</style>
</body>
</html>
