<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gero Dashboard | A Multi-chain Light Wallet Merging Web2 and Web3</title>

  <!-- Critical performance optimizations -->
  <!-- Asset preloads will be handled by Vite during build -->
  <!-- <link rel="preload" as="image" href="./assets/cardanoBg.png" media="(max-width: 1920px)" fetchpriority="high"> -->
  <!-- <link rel="preload" as="image" href="./assets/apexBg.png" media="(max-width: 1920px)" fetchpriority="high"> -->

  <!-- Fonts are self-hosted and bundled: see the @fontsource imports at the top of main.ts.
       Nothing is fetched from a remote font CDN, so the extension renders identically offline
       and the production CSP pins font-src to 'self'. -->
  <!-- media="all" (Vite's documented escape hatch, vitejs/vite#6748) stops Vite's HTML transform
       from merging this stylesheet into the app's own bundled CSS at build time. It still gets
       emitted as its own hashless asset (extension/assets/gero-swap.css) with the href rewritten
       accordingly; scripts/prepare.ts's Windows path-fixup normalizes that reference correctly for
       both entry points. The vendor copy under extension/vendor/gero-swap/ remains the source of
       truth on disk (and the loader script below is served from there), but this <link> ends up
       pointing at the Vite-emitted copy in extension/assets/ instead of /vendor/gero-swap/. -->
  <link rel="stylesheet" href="/vendor/gero-swap/gero-swap.css" media="all" />
  <script src="/vendor/gero-swap/gero-swap.js"></script>
</head>
<body>
<div id="app"></div>
<script type="module" src="./main.ts"></script>
<!-- built files will be auto injected -->
</body>
<style>
  /* This inline block is emitted AFTER the bundled stylesheet, so anything
     declared here beats baseline.css on source order. Keep it to layout only:
     the scrollbar recipe and .geroButton live in src/shared/styles/baseline.css.
     The old per-chain Apex CTA class is retired: the gradient now follows
     --g-grad-1/--g-grad-2, which useChainAccent re-points on wallet switch. */
  html {
    overflow-y: auto;
  }
  .v-application {
    font-family: 'Inter Variable', 'Inter', system-ui, sans-serif;
  }

  .container {
    width: 100%;
    padding: 12px;
    margin-right: auto;
    margin-left: auto;
  }
  @media (min-width: 960px) {
    .container {
      max-width: 100%;
    }
  }
  @media (min-width: 1785px) {
    .container {
      max-width: 100%;
    }
  }
  @media (min-width: 1785px) {
    .container {
      max-width: 1785px;
    }
  }
  #cashbacktermsexclusions {
    display: none!important;
  }
  .settingsOverlay .v-overlay__content {
    width: 100% !important;
    height: 100% !important;
  }

  .hardwareOverlay .v-overlay__content {
    display: flex;
    flex-flow: column;
    justify-content: space-between;
    flex: 0 1 auto;
    height: -webkit-fill-available;
    padding: 36px;
    width: 100%;
  }
  .no-opacity.v-btn--plain:not(.v-btn--active):not(.v-btn--loading):not(:focus):not(:hover) .v-btn__content {
    opacity: 1;
  }
  .cashback-search.v-text-field--solo > .v-input__control > .v-input__slot {
    background: #0f0f0f;
  }
  .text-transparent {
    display: none;
  }
  .v-application--is-ltr .v-textarea.v-text-field--enclosed.metadataTextArea .v-text-field__slot textarea {
    margin-top: 0;
    line-height: 1;
  }

  .gradient-text {
    background: linear-gradient(to right, #00c7f3, #00fad5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .apex-gradient-text {
    background: linear-gradient(to right, #F8A282, #FECB82);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
</style>
</html>
