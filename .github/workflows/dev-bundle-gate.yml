name: Dev Bundle Gate

# Pre-merge build gate for PRs targeting `development` (and `main`).
#
# Why this exists: ci-cd.yml only builds on push to `main`, so Vue SFC *syntax*
# errors and other bundle-breaking changes reached `development` uncaught and
# only surfaced after merge to main. This bundles the main-UI vite config
# (vite parses every single-file component) so those breaks fail pre-merge.
#
# Why only build:web (not the full `npm run build`): `npm run build` runs 4 vite
# builds in parallel via run-p, each with --max-old-space-size=6144 (~24GB peak),
# which OOM-kills the shared self-hosted `gero-plain` runner. build:web is a
# single vite process (~6GB) and bundles the options/popup/sidepanel app — where
# essentially all Vue SFCs live. background/content/inject are TS entrypoints
# with ~no SFCs, so this keeps the SFC-syntax coverage while fitting the runner.
#
# Why build-only (no tsc/eslint step): `npm run typecheck` (plain tsc) is
# systemically red against this repo — tsc doesn't resolve unplugin-auto-imports
# (`computed`, `ref`, ...) or the `browser` global, so it reports hundreds of
# pre-existing false errors and would make the gate permanently fail. The vite
# build DOES resolve auto-imports, so it reflects real buildability. (vue-tsc is
# also unavailable: Vue 2.7 + TS 5.8 has no compatible version — 1.x caps at
# ~TS 5.4, 2.x+ dropped Vue 2.) Cleaning up the tsc/lint debt is a separate task.
#
# Secret-free by design: it synthesizes a placeholder .env.production from the
# VITE_* names the source references (VITE_* values are inlined runtime strings,
# not build secrets), so the bundle path matches production without exposing
# credentials and without depending on a committed env file.

on:
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - development

permissions:
  contents: read

# One in-flight run per branch; newer pushes cancel stale runs.
concurrency:
  group: dev-bundle-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Production bundle (SFC parse)
    # Fork PRs run here too. The same-repo guard this job used to carry existed
    # because it ran `npm ci` + `npm run build` — PR-controlled install scripts
    # and build-time JS — on the shared self-hosted `gero-plain` runner. That
    # stopped being true when the job moved to `ubuntu-latest` (see below), and a
    # skipped required check counts as PASSING for branch protection, so the guard
    # was leaving every external contribution merged with the gate green and never
    # run. Safe to drop: `pull_request` (not `pull_request_target`) checks out the
    # fork's tree with a read-only token on a disposable hosted runner, and no
    # secrets are exposed here (contents: read only).
    # GitHub-hosted: the repo is public, and the self-hosted arc-private runner
    # group forbids public-repo jobs (allows_public_repositories:false), so
    # gero-plain jobs never dispatch. Hosted runners also avoid exposing internal
    # runners to public/fork PRs. ~16GB RAM here comfortably fits the 4096 heap.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # 4096, not 6144: with the larger cap the vite process balloons past the
      # gero-plain host's physical memory and the OOM killer takes out the
      # runner agent mid-build (job dies with the build step never marked
      # completed and NO logs uploaded - observed repeatedly on PR #778, with
      # pass/fail alternating on identical trees as GC timing decided). The
      # build completes comfortably in a 4GB heap (~35s locally); a lower cap
      # makes Node GC harder instead of gambling against host memory.
      NODE_OPTIONS: "--max-old-space-size=4096 --max-semi-space-size=128"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Design ratchet. Unlike tsc/eslint (see the header note) these gates are
      # green today and may only get greener: audit.mjs fails if any style-debt
      # metric in scripts/design/budgets.json grows, and contrast.mjs fails if a
      # token drops below its WCAG threshold. Pure Node, no ripgrep dependency,
      # so it runs identically here and in the pre-commit hook. Runs before the
      # bundle because it takes ~1s and the bundle takes minutes.
      - name: Design ratchet (budgets + WCAG contrast)
        run: npm run design:check

      # Placeholder env: VITE_* are inlined runtime strings, so the bundle parse
      # needs no real secrets. build:web is the single main-UI vite config; it
      # parses every SFC in options/popup/sidepanel and fails on syntax errors.
      - name: Bundle check (build:web, placeholder env)
        run: |
          # Synthesize the placeholder from the VITE_* names the source actually
          # references, rather than from a committed .env.example. That file was
          # removed (it carried MANIFEST_KEY), and hard-depending on it made this
          # gate fail for a reason unrelated to buildability. Deriving the list
          # from src/ also keeps it correct as new vars are added.
          grep -rhoE 'VITE_[A-Z0-9_]+' src/ scripts/ 2>/dev/null             | sort -u | sed 's/$/=placeholder/' > .env.production
          echo "Wrote placeholder .env.production ($(grep -c '^VITE_' .env.production) vars)"
          npm run build:web -- --mode production
