name: Help browser evidence

on:
  # Optional evidence, separate from the required Ledger check. Do not require
  # this path-filtered check in branch protection: docs-only PRs may skip it.
  pull_request:
    branches: [development, main]
    paths:
      - '.github/workflows/help-browser-evidence.yml'
      # Cover application and build dependencies without maintaining an import
      # allowlist. Shared UI, support transport, CSP, and chunks all affect Help.
      - 'src/**'
      - 'scripts/**'
      - 'docs/help-browser-verification.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'jsconfig*.json'
      - 'vite.config*.mts'
  # GitHub schedules run on the default branch, currently development. This
  # safety net becomes active only after the workflow is merged there.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: help-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Help browser scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
      # node-hid (Node-only Ledger transport from @cardano-sdk/hardware-ledger; the
      # extension uses WebHID) downloads a prebuilt binary from GitHub releases and
      # compiles from source when that fails, as it did on 2026-11-08 (504s). These
      # headers let that fallback build. Non-fatal: npm ci still passes if the download works.
      - name: Install node-hid build dependencies
        continue-on-error: true
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 libusb-1.0-0-dev libudev-dev
      - run: npm ci
      - name: Build every production extension entry point
        run: node scripts/build-isolated-extension.mjs .

      - name: Install isolated Help browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/help-browser" --no-audit --no-fund --ignore-scripts playwright@1.61.0
          node "$RUNNER_TEMP/help-browser/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Help browser acceptance with synthetic API fixtures
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/help-browser/node_modules/playwright
          HELP_SMOKE_OUTPUT: ${{ runner.temp }}/help-browser-evidence
        run: |
          node scripts/help-browser/foundation-smoke.cjs
          node scripts/help-browser/published-smoke.cjs
          node scripts/help-browser/updates-smoke.cjs

      - name: Upload reproducible Help browser evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: help-browser-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/help-browser-evidence
          if-no-files-found: warn
          retention-days: 2

      - name: Report actual artifact expiry
        if: always() && steps.evidence.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          expires_at="$(gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID" --jq '.expires_at')"
          {
            printf '### Help browser evidence\n\n'
            printf '[Download screenshots and JSON reports](%s)\n\n' "$ARTIFACT_URL"
            printf 'GitHub reports expiry at **%s**. Download before that time.\n' "$expires_at"
            printf 'The scenario scripts and synthetic fixtures remain in Git after expiry.\n'
          } >> "$GITHUB_STEP_SUMMARY"
