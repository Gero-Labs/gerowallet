# Upload a tested, tagged release to the Chrome Web Store and submit it for review.
#
# "Chrome Extension CI/CD" (ci-cd.yml) builds, tests and archives a candidate, and with
# dry_run=false tags that commit v<version>, naming its own run in the tag message.
# This workflow takes that run's archive as it is: it re-checks provenance, version,
# channel, identity and every file hash, then uploads the same ZIP. It never builds,
# edits or repacks the package.
#
# Before the upload, the full isolated browser suites of Gero-Labs/gerowallet-e2e-tests
# (post-v2.7 in three shards, plus legacy) run against that ZIP, extracted. Any failure,
# or a test that passed only on retry, blocks the upload.
#
# The upload job runs in the chrome-web-store-<channel> environment. Its required
# reviewers are the release authorization, and its secrets exist only there.
# Setup and recovery: .github/runbooks/chrome-web-store.md
name: Chrome Web Store release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already tested and tagged by "Chrome Extension CI/CD" (for example 2.8.0)'
        type: string
        required: true
      channel:
        description: 'Store listing to update; must be the channel the tested package was built for'
        type: choice
        options: [production, beta]
        default: production
      submission:
        description: 'staged = submit, then publish by hand once approved; publish = goes live as soon as approved; upload-only = draft, no review'
        type: choice
        options: [staged, publish, upload-only]
        default: staged
      deploy_percentage:
        description: 'Optional rollout percentage, 1-100 (the store allows it only above 10,000 weekly users). Empty = everyone'
        type: string
        required: false
        default: ''
      dry_run:
        description: 'Verify and e2e-test the package only; do not contact the Chrome Web Store'
        type: boolean
        default: true

permissions:
  contents: read

# One store operation per listing at a time; never cancel one halfway through.
concurrency:
  group: chrome-web-store-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tested package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.release.outputs.run_id }}
      sha: ${{ steps.release.outputs.sha }}
      zip_sha256: ${{ steps.package.outputs.zip_sha256 }}
      extension_id: ${{ steps.package.outputs.extension_id }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      CHANNEL: ${{ inputs.channel }}
      SUBMISSION: ${{ inputs.submission }}
      DEPLOY_PERCENTAGE: ${{ inputs.deploy_percentage }}
    steps:
      - name: Check the inputs
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::version must look like 2.8.0" >&2; exit 1
          fi
          if [ -n "$DEPLOY_PERCENTAGE" ]; then
            if ! [[ "$DEPLOY_PERCENTAGE" =~ ^[0-9]+$ ]] || [ "$DEPLOY_PERCENTAGE" -lt 1 ] || [ "$DEPLOY_PERCENTAGE" -gt 100 ]; then
              echo "::error::deploy_percentage must be a whole number from 1 to 100" >&2; exit 1
            fi
            if [ "$SUBMISSION" = 'upload-only' ]; then
              echo "::error::deploy_percentage needs a submission (staged or publish)" >&2; exit 1
            fi
          fi

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'

      # The tag is created only by ci-cd.yml's publish job, on the commit its run tested,
      # with that run's ID in the message. The run must be that workflow, on that commit,
      # and have succeeded.
      - name: Find the release tag and the run that tested it
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${RELEASE_VERSION}"
          if [ "$(git cat-file -t "refs/tags/${tag}" 2>/dev/null)" != 'tag' ]; then
            echo "::error::${tag} is not an annotated release tag. Run \"Chrome Extension CI/CD\" with expected_version=${RELEASE_VERSION} and dry_run=false first." >&2
            exit 1
          fi
          sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
          run_id="$(git for-each-ref --format='%(contents)' "refs/tags/${tag}" | sed -nE 's/.*workflow ([0-9]+).*/\1/p' | head -n 1)"
          if [ -z "$run_id" ]; then
            echo "::error::${tag} does not name the workflow run that tested it" >&2; exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > run.json
          jq -e --arg sha "$sha" '
            (.path | split("@")[0]) == ".github/workflows/ci-cd.yml"
            and .event == "workflow_dispatch"
            and .conclusion == "success"
            and .head_sha == $sha
          ' run.json > /dev/null || {
            echo "::error::Run ${run_id} is not a successful \"Chrome Extension CI/CD\" release run on ${sha}" >&2; exit 1
          }
          lock_sha256="$(git show "${sha}:package-lock.json" | sha256sum | cut -d ' ' -f 1)"
          {
            echo "sha=${sha}"
            echo "run_id=${run_id}"
            echo "lock_sha256=${lock_sha256}"
          } >> "$GITHUB_OUTPUT"

      - name: Download the tested package from that run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gero-extension-${{ steps.release.outputs.sha }}
          path: candidate
          run-id: ${{ steps.release.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Re-check the package and its ZIP
        id: package
        env:
          SOURCE_SHA: ${{ steps.release.outputs.sha }}
          LOCK_SHA256: ${{ steps.release.outputs.lock_sha256 }}
        run: |
          zip="candidate/release-evidence/Gero-v${RELEASE_VERSION}.zip"
          (cd candidate/release-evidence && sha256sum -c SHA256SUMS)
          mkdir unzipped
          unzip -q "$zip" -d unzipped
          node scripts/chrome-web-store.mjs verify --candidate candidate --unzipped unzipped \
            --version "$RELEASE_VERSION" --channel "$CHANNEL" --source-sha "$SOURCE_SHA" --lock-sha256 "$LOCK_SHA256"
          echo "zip_sha256=$(sha256sum "$zip" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          SOURCE_SHA: ${{ steps.release.outputs.sha }}
          RUN_ID: ${{ steps.release.outputs.run_id }}
          ZIP_SHA256: ${{ steps.package.outputs.zip_sha256 }}
          EXTENSION_ID: ${{ steps.package.outputs.extension_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Gero ${RELEASE_VERSION} (${CHANNEL}) matches what was tested"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${SOURCE_SHA}\` |"
            echo "| Tested in | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID} |"
            echo "| Extension ID | \`${EXTENSION_ID}\` |"
            echo "| ZIP SHA-256 | \`${ZIP_SHA256}\` |"
            echo "| Next | E2E suites, then $([ "$DRY_RUN" = 'true' ] && echo 'stop (dry run: nothing sent to the store)' || echo "upload, then: ${SUBMISSION}") |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The full isolated suites, on the exact bytes the store will receive. The harness is
  # the e2e repo's own (same commands and settings as its post-v27-e2e.yml); only the
  # wallet differs: the extracted release ZIP instead of a fresh test build.
  #
  # Nothing here runs code from a ref chosen when the workflow is started. This workflow
  # runs with the default branch's cache scope, which every branch can read, so such
  # code could poison caches. The harness is the e2e repo's reviewed development branch,
  # and no wallet source is checked out: the commit and ZIP hash are bound into each
  # suite's qualification.json instead, and the gate checks both.
  e2e:
    name: E2E ${{ matrix.suite }} (${{ matrix.shard }}/${{ matrix.of }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: post-v27, shard: 1, of: 3 }
          - { suite: post-v27, shard: 2, of: 3 }
          - { suite: post-v27, shard: 3, of: 3 }
          - { suite: legacy, shard: 1, of: 1 }
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      WALLET_SHA: ${{ needs.verify.outputs.sha }}
      ZIP_SHA256: ${{ needs.verify.outputs.zip_sha256 }}
      SUITE: ${{ matrix.suite }}
    steps:
      - name: Checkout the e2e harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Gero-Labs/gerowallet-e2e-tests
          ref: development
          persist-credentials: false

      # The wallet's own release scripts, from the commit that runs this workflow.
      - name: Checkout this workflow's scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: .release-scripts
          persist-credentials: false

      # No npm cache either: this job saves nothing that a later run restores.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Install the harness
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Download the tested package from its run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gero-extension-${{ needs.verify.outputs.sha }}
          path: .candidate
          run-id: ${{ needs.verify.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Put the verified ZIP under test
        run: |
          zip=".candidate/release-evidence/Gero-v${RELEASE_VERSION}.zip"
          echo "${ZIP_SHA256}  ${zip}" | sha256sum -c -
          unzip -q "$zip" -d .wallet-under-test/extension
          echo "harness_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run the post-v2.7 suite
        if: matrix.suite == 'post-v27'
        run: npm run test:post-v27 -- --shard=${{ matrix.shard }}/${{ matrix.of }}
        env:
          POST_V27_EXTENSION_PATH: ${{ github.workspace }}/.wallet-under-test/extension
          WALLET_CANDIDATE_SHA: ${{ needs.verify.outputs.sha }}
          WALLET_RELEASE_ARCHIVE_SHA256: ${{ needs.verify.outputs.zip_sha256 }}
          SUBMIT_API_REQUIRED: 'true'
          EXPLORER_SETTING_REQUIRED: 'true'

      - name: Run the legacy suite
        if: matrix.suite == 'legacy'
        run: npm run test:legacy:isolated -- --shard=${{ matrix.shard }}/${{ matrix.of }}
        env:
          EXTENSION_PATH: ${{ github.workspace }}/.wallet-under-test/extension
          WALLET_CANDIDATE_SHA: ${{ needs.verify.outputs.sha }}
          WALLET_RELEASE_ARCHIVE_SHA256: ${{ needs.verify.outputs.zip_sha256 }}
          SUBMIT_API_REQUIRED: 'true'
          EXPLORER_SETTING_REQUIRED: 'true'

      - name: Check the e2e result for this package
        run: |
          dir="test-results/$([ "$SUITE" = legacy ] && echo legacy-isolated || echo post-v27)"
          node .release-scripts/scripts/chrome-web-store.mjs e2e-gate --qualification "${dir}/qualification.json" \
            --wallet-sha "$WALLET_SHA" --archive-sha256 "$ZIP_SHA256"

      # Summaries only. This repository is public, and the suites' screenshots, videos and
      # traces can show the disposable recovery phrases the tests create.
      - name: Keep the e2e summary
        if: ${{ !cancelled() }}
        run: |
          mkdir -p e2e-evidence
          for file in test-results/post-v27/qualification.json test-results/legacy-isolated/qualification.json; do
            [ -e "$file" ] && cp "$file" "e2e-evidence/$(basename "$(dirname "$file")")-$(basename "$file")"
          done
          printf '{"harnessRepository":"Gero-Labs/gerowallet-e2e-tests","harnessSha":"%s","walletSha":"%s","releaseArchiveSha256":"%s"}\n' \
            "${harness_sha:-}" "$WALLET_SHA" "$ZIP_SHA256" > e2e-evidence/e2e-run.json
      - name: Upload the e2e summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-${{ inputs.channel }}-${{ inputs.version }}-${{ matrix.suite }}-${{ matrix.shard }}-${{ github.run_id }}
          path: e2e-evidence/
          retention-days: 90
          if-no-files-found: warn

  submit:
    name: Upload to the Chrome Web Store
    needs: [verify, e2e]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewers on this environment approve the release; its vars and secrets
    # are the store credentials for this channel's listing.
    environment: chrome-web-store-${{ inputs.channel }}
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SUBMISSION: ${{ inputs.submission }}
      DEPLOY_PERCENTAGE: ${{ inputs.deploy_percentage }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'

      - name: Download the tested package from its run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gero-extension-${{ needs.verify.outputs.sha }}
          path: candidate
          run-id: ${{ needs.verify.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Confirm it is the ZIP that was verified
        env:
          ZIP_SHA256: ${{ needs.verify.outputs.zip_sha256 }}
        run: echo "${ZIP_SHA256}  candidate/release-evidence/Gero-v${RELEASE_VERSION}.zip" | sha256sum -c -

      - name: Upload and submit
        env:
          EXTENSION_ID: ${{ needs.verify.outputs.extension_id }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          mkdir -p store-evidence
          args=(release --zip "candidate/release-evidence/Gero-v${RELEASE_VERSION}.zip" --version "$RELEASE_VERSION"
            --expected-id "$EXTENSION_ID" --submission "$SUBMISSION" --report store-evidence/submission.json)
          if [ -n "$DEPLOY_PERCENTAGE" ]; then args+=(--deploy-percentage "$DEPLOY_PERCENTAGE"); fi
          node scripts/chrome-web-store.mjs "${args[@]}"

      # The report holds store states and versions only: no token or credential.
      - name: Keep the store's answer
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: chrome-web-store-${{ inputs.channel }}-${{ inputs.version }}-${{ github.run_id }}
          path: store-evidence/
          retention-days: 90
          if-no-files-found: warn

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';
          const file = 'store-evidence/submission.json';
          if (!fs.existsSync(file)) { console.log('### Nothing reached the Chrome Web Store'); process.exit(0); }
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (!report.ok) { console.log(`### Chrome Web Store step failed\n\n${report.error}`); process.exit(0); }
          const next = {
            staged: 'In review. Once approved, publish it from the Developer Dashboard.',
            publish: 'In review. It goes live as soon as it is approved.',
            'upload-only': 'Saved as a draft. Nothing was submitted for review.',
          }[report.submission];
          console.log(`### Gero ${report.version} uploaded to the Chrome Web Store\n`);
          console.log(`Item \`${report.itemId}\`, submission state: ${report.submissionState ?? 'none'}.\n\n${next}`);
          NODE
