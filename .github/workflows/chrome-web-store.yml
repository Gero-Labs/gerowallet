# Build, test and release GeroWallet to the Chrome Web Store, all in one run.
#
# 1. "Chrome Extension CI/CD" (ci-cd.yml, called as the first job) builds the commit this
#    workflow runs on, runs the unit suite and archives the package with its checksums.
# 2. That package is re-checked: version, channel, identity and every file hash, for both
#    the extension directory and its extracted ZIP.
# 3. The full isolated browser suites of Gero-Labs/gerowallet-e2e-tests (post-v2.7 in three
#    shards, plus legacy) run against that ZIP, extracted. Any failure, or a test that
#    passed only on retry, stops the release.
#    Beside them, the upgrade rehearsal updates one 2.7.2 profile in place to that ZIP and
#    then to a forward recovery package (this commit, next patch version); see below.
# 4. With dry_run=false, the upload job runs in the chrome-web-store-<channel> environment.
#    Its required reviewers are the release authorization, only the people in its
#    CWS_RELEASERS variable may start a release, and its store credentials exist only
#    there. It tags the commit v<version>, then uploads the same ZIP and submits it.
#
# Nothing is rebuilt, edited or repacked after step 1.
# Setup and recovery: .github/runbooks/chrome-web-store.md
name: Chrome Web Store release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version committed in package.json and package-lock.json (for example 2.8.0)'
        type: string
        required: true
      channel:
        description: 'Store listing to update; must be the channel the repository settings build for'
        type: choice
        options: [production, beta]
        default: production
      submission:
        description: 'staged = submit, then publish by hand once approved; publish = goes live as soon as approved; upload-only = draft, no review'
        type: choice
        options: [staged, publish, upload-only]
        default: staged
      deploy_percentage:
        description: 'Optional rollout percentage, 1-100 (the store allows it only above 10,000 weekly users). Empty = everyone'
        type: string
        required: false
        default: ''
      dry_run:
        description: 'Build, test and e2e-test only; no tag, nothing sent to the Chrome Web Store'
        type: boolean
        default: true

permissions:
  contents: read

# One store operation per listing at a time; never cancel one halfway through.
concurrency:
  group: chrome-web-store-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  build:
    name: Chrome Extension CI/CD
    uses: ./.github/workflows/ci-cd.yml
    with:
      expected_version: ${{ inputs.version }}
    secrets:
      MANIFEST_KEY: ${{ secrets.MANIFEST_KEY }}
      VITE_MOONPAY_API_KEY: ${{ secrets.VITE_MOONPAY_API_KEY }}
      VITE_GUARDARIAN_API_KEY: ${{ secrets.VITE_GUARDARIAN_API_KEY }}

  verify:
    name: Verify the tested package
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      zip_sha256: ${{ steps.package.outputs.zip_sha256 }}
      extension_id: ${{ steps.package.outputs.extension_id }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      CHANNEL: ${{ inputs.channel }}
      SUBMISSION: ${{ inputs.submission }}
      DEPLOY_PERCENTAGE: ${{ inputs.deploy_percentage }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Check the inputs
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::version must look like 2.8.0" >&2; exit 1
          fi
          if [ -n "$DEPLOY_PERCENTAGE" ]; then
            if ! [[ "$DEPLOY_PERCENTAGE" =~ ^[0-9]+$ ]] || [ "$DEPLOY_PERCENTAGE" -lt 1 ] || [ "$DEPLOY_PERCENTAGE" -gt 100 ]; then
              echo "::error::deploy_percentage must be a whole number from 1 to 100" >&2; exit 1
            fi
            if [ "$SUBMISSION" = 'upload-only' ]; then
              echo "::error::deploy_percentage needs a submission (staged or publish)" >&2; exit 1
            fi
          fi

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'

      # Only the upload job creates v<version>, on the commit it releases. A tag on
      # another commit means this version was already released from there. A dry run
      # releases nothing, so it only warns and goes on testing.
      - name: Check the release tag
        run: |
          tag="v${RELEASE_VERSION}"
          if tagged="$(git rev-parse --verify --quiet "refs/tags/${tag}^{commit}")" && [ "$tagged" != "$GITHUB_SHA" ]; then
            message="${tag} already marks ${tagged}, not ${GITHUB_SHA}. Release a new version."
            if [ "$DRY_RUN" = 'true' ]; then echo "::warning::${message}"; else echo "::error::${message}" >&2; exit 1; fi
          fi

      - name: Download the tested package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gero-extension-${{ github.sha }}
          path: candidate

      - name: Re-check the package and its ZIP
        id: package
        run: |
          zip="candidate/release-evidence/Gero-v${RELEASE_VERSION}.zip"
          (cd candidate/release-evidence && sha256sum -c SHA256SUMS)
          mkdir unzipped
          unzip -q "$zip" -d unzipped
          lock_sha256="$(sha256sum package-lock.json | cut -d ' ' -f 1)"
          node scripts/chrome-web-store.mjs verify --candidate candidate --unzipped unzipped \
            --version "$RELEASE_VERSION" --channel "$CHANNEL" --source-sha "$GITHUB_SHA" --lock-sha256 "$lock_sha256"
          echo "zip_sha256=$(sha256sum "$zip" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          ZIP_SHA256: ${{ steps.package.outputs.zip_sha256 }}
          EXTENSION_ID: ${{ steps.package.outputs.extension_id }}
        run: |
          {
            echo "### Gero ${RELEASE_VERSION} (${CHANNEL}) built, tested and verified"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Extension ID | \`${EXTENSION_ID}\` |"
            echo "| ZIP SHA-256 | \`${ZIP_SHA256}\` |"
            echo "| Next | E2E suites, then $([ "$DRY_RUN" = 'true' ] && echo 'stop (dry run: no tag, nothing sent to the store)' || echo "approval, tag v${RELEASE_VERSION}, upload, then: ${SUBMISSION}") |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The full isolated suites, on the exact bytes the store will receive. The harness is
  # the e2e repo's own (same commands and settings as its post-v27-e2e.yml); only the
  # wallet differs: the extracted release ZIP instead of a fresh test build.
  #
  # Nothing here runs code from a ref chosen when the workflow is started. This workflow
  # runs with the default branch's cache scope, which every branch can read, so such
  # code could poison caches. The harness is the e2e repo's reviewed development branch,
  # and no wallet source is checked out: the commit and ZIP hash are bound into each
  # suite's qualification.json instead, and the gate checks both.
  e2e:
    name: E2E ${{ matrix.suite }} (${{ matrix.shard }}/${{ matrix.of }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: post-v27, shard: 1, of: 3 }
          - { suite: post-v27, shard: 2, of: 3 }
          - { suite: post-v27, shard: 3, of: 3 }
          - { suite: legacy, shard: 1, of: 1 }
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      ZIP_SHA256: ${{ needs.verify.outputs.zip_sha256 }}
      SUITE: ${{ matrix.suite }}
    steps:
      # The harness repository is private, and this run's own token reads only this
      # repository. E2E_HARNESS_TOKEN is a read-only token for that one repository; the
      # checkout does not keep it, so the harness never sees it.
      - name: Check the harness token
        env:
          E2E_HARNESS_TOKEN: ${{ secrets.E2E_HARNESS_TOKEN }}
        run: |
          if [ -z "$E2E_HARNESS_TOKEN" ]; then
            echo "::error::The E2E_HARNESS_TOKEN secret is not set: a read-only token for Gero-Labs/gerowallet-e2e-tests (see .github/runbooks/chrome-web-store.md)" >&2
            exit 1
          fi

      - name: Checkout the e2e harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Gero-Labs/gerowallet-e2e-tests
          ref: development
          token: ${{ secrets.E2E_HARNESS_TOKEN }}
          persist-credentials: false

      # The wallet's own release scripts, from the commit that runs this workflow.
      - name: Checkout this workflow's scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: .release-scripts
          persist-credentials: false

      # No npm cache either: this job saves nothing that a later run restores.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Install the harness
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Download the tested package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gero-extension-${{ github.sha }}
          path: .candidate

      - name: Put the verified ZIP under test
        run: |
          zip=".candidate/release-evidence/Gero-v${RELEASE_VERSION}.zip"
          echo "${ZIP_SHA256}  ${zip}" | sha256sum -c -
          # unzip -d creates only the last directory of the path.
          mkdir -p .wallet-under-test/extension
          unzip -q "$zip" -d .wallet-under-test/extension
          echo "harness_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run the post-v2.7 suite
        if: matrix.suite == 'post-v27'
        run: npm run test:post-v27 -- --shard=${{ matrix.shard }}/${{ matrix.of }}
        env:
          POST_V27_EXTENSION_PATH: ${{ github.workspace }}/.wallet-under-test/extension
          WALLET_CANDIDATE_SHA: ${{ github.sha }}
          WALLET_RELEASE_ARCHIVE_SHA256: ${{ needs.verify.outputs.zip_sha256 }}
          SUBMIT_API_REQUIRED: 'true'
          EXPLORER_SETTING_REQUIRED: 'true'

      - name: Run the legacy suite
        if: matrix.suite == 'legacy'
        run: npm run test:legacy:isolated -- --shard=${{ matrix.shard }}/${{ matrix.of }}
        env:
          EXTENSION_PATH: ${{ github.workspace }}/.wallet-under-test/extension
          WALLET_CANDIDATE_SHA: ${{ github.sha }}
          WALLET_RELEASE_ARCHIVE_SHA256: ${{ needs.verify.outputs.zip_sha256 }}
          SUBMIT_API_REQUIRED: 'true'
          EXPLORER_SETTING_REQUIRED: 'true'

      - name: Check the e2e result for this package
        run: |
          dir="test-results/$([ "$SUITE" = legacy ] && echo legacy-isolated || echo post-v27)"
          node .release-scripts/scripts/chrome-web-store.mjs e2e-gate --qualification "${dir}/qualification.json" \
            --wallet-sha "$GITHUB_SHA" --archive-sha256 "$ZIP_SHA256"

      # Summaries only. This repository is public, and the suites' screenshots, videos and
      # traces can show the disposable recovery phrases the tests create.
      - name: Keep the e2e summary
        if: ${{ !cancelled() }}
        run: |
          mkdir -p e2e-evidence
          for file in test-results/post-v27/qualification.json test-results/legacy-isolated/qualification.json; do
            [ -e "$file" ] && cp "$file" "e2e-evidence/$(basename "$(dirname "$file")")-$(basename "$file")"
          done
          printf '{"harnessRepository":"Gero-Labs/gerowallet-e2e-tests","harnessSha":"%s","walletSha":"%s","releaseArchiveSha256":"%s"}\n' \
            "${harness_sha:-}" "$GITHUB_SHA" "$ZIP_SHA256" > e2e-evidence/e2e-run.json
      - name: Upload the e2e summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-${{ inputs.channel }}-${{ inputs.version }}-${{ matrix.suite }}-${{ matrix.shard }}-${{ github.run_id }}
          path: e2e-evidence/
          retention-days: 90
          if-no-files-found: warn

  # The two other packages of the in-place upgrade rehearsal (#1296), built with the
  # store's extension key so all three share one extension ID:
  #   old       the 2.7.2 release, from its tagged commit (pinned by SHA, not the movable
  #             tag) with the Node it was released with. The rehearsal's profile is made
  #             by this package's own UI.
  #   recovery  the forward recovery package: this commit at the next patch version,
  #             i.e. what would be shipped if the candidate had to be replaced in place
  #             (Chrome never installs a lower version). It must still read every secret
  #             format the candidate writes.
  # Nothing is cached, so the code these builds run can poison nothing (see e2e above).
  upgrade-fixtures:
    name: Upgrade rehearsal package (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - { fixture: old, ref: b17ac752c38a0a59b370feedf60af80cd6e95e77, version: '2.7.2', node: '22.11.0' }
          - { fixture: recovery, ref: '', version: '', node: '24.19.0' }
    env:
      NODE_OPTIONS: "--max-old-space-size=4096 --max-semi-space-size=128"
      MANIFEST_KEY: ${{ vars.MANIFEST_KEY || secrets.MANIFEST_KEY }}
      EXPECTED_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
      RELEASE_VERSION: ${{ inputs.version }}
      FIXTURE: ${{ matrix.fixture }}
    steps:
      - name: Check the store identity
        run: |
          if [ -z "$MANIFEST_KEY" ] || ! [[ "$EXPECTED_EXTENSION_ID" =~ ^[a-p]{32}$ ]]; then
            echo "::error::The upgrade rehearsal needs MANIFEST_KEY and CHROME_EXTENSION_ID: an update keeps a profile only under the same extension ID" >&2
            exit 1
          fi

      - name: Checkout the package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.ref || github.sha }}
          path: source
          persist-credentials: false

      - name: Checkout this workflow's scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: .release-scripts
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Upgrade npm
        run: npm install --global npm@11.1.0

      # Same as ci-cd.yml: lets node-hid build from source if its prebuilt download fails.
      - name: Install node-hid build dependencies
        continue-on-error: true
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 libusb-1.0-0-dev libudev-dev

      - name: Set the package version
        working-directory: source
        env:
          PINNED_VERSION: ${{ matrix.version }}
        run: |
          if [ "$FIXTURE" = old ]; then
            version="$(node -p "require('./package.json').version")"
            [ "$version" = "$PINNED_VERSION" ] || { echo "::error::The pinned commit is ${version}, not ${PINNED_VERSION}" >&2; exit 1; }
          else
            committed="$(node -p "require('./package.json').version")"
            [ "$committed" = "$RELEASE_VERSION" ] || { echo "::error::This commit is ${committed}, not ${RELEASE_VERSION}" >&2; exit 1; }
            # The next patch: 2.8.0 -> 2.8.1, and 2.8.0.4 -> 2.8.0.5.
            version="$(node -p "const p = process.argv[1].split('.'); p[p.length - 1] = String(Number(p.at(-1)) + 1); p.join('.')" "$RELEASE_VERSION")"
            npm version "$version" --no-git-tag-version
          fi
          echo "PACKAGE_VERSION=${version}" >> "$GITHUB_ENV"
          echo "PACKAGE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Write production env
        working-directory: source
        env:
          PRODUCTION_VARS: ${{ toJSON(vars) }}
          VITE_MOONPAY_API_KEY: ${{ secrets.VITE_MOONPAY_API_KEY }}
          VITE_GUARDARIAN_API_KEY: ${{ secrets.VITE_GUARDARIAN_API_KEY }}
        run: node ../.release-scripts/scripts/write-production-env.mjs .env.production

      # A recovery that cannot open the gpw2 envelope would lock out every migrated
      # wallet. 2.7.2 predates gpw2, which is exactly what the rehearsal upgrades from.
      - name: Secret envelope readers present
        if: matrix.fixture == 'recovery'
        working-directory: source
        run: node scripts/check-secret-envelope-readers.mjs

      - name: Build
        working-directory: source
        run: npm run build

      - name: Check and keep the package
        run: |
          mkdir -p "fixture/release-evidence"
          if [ "$FIXTURE" = recovery ]; then
            (cd source && node scripts/check-release-artifact.mjs extension --expected-version "$PACKAGE_VERSION" \
              --expected-id "$EXPECTED_EXTENSION_ID" --report ../fixture/release-evidence/artifact.json)
          else
            # The old release only has to be itself under the store ID; today's package
            # rules are not its rules.
            node --input-type=module - source/extension/manifest.json <<'NODE'
          import fs from 'node:fs';
          import { extensionIdForKey } from './.release-scripts/scripts/check-release-artifact.mjs';
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (manifest.version !== process.env.PACKAGE_VERSION) throw new Error(`manifest is ${manifest.version}`);
          if (!manifest.key || extensionIdForKey(manifest.key) !== process.env.EXPECTED_EXTENSION_ID) throw new Error('manifest key is not the store ID');
          fs.writeFileSync('fixture/release-evidence/artifact.json', JSON.stringify({ ok: true, version: manifest.version, extensionId: process.env.EXPECTED_EXTENSION_ID }, null, 2) + '\n');
          NODE
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'fixture/release-evidence/artifact.json';
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          Object.assign(report, { sourceSha: process.env.PACKAGE_SHA, workflowRun: process.env.GITHUB_RUN_ID, fixture: process.env.FIXTURE });
          fs.writeFileSync(file, JSON.stringify(report, null, 2) + '\n');
          NODE
          mv source/extension fixture/extension

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upgrade-${{ matrix.fixture }}-${{ github.run_id }}
          path: fixture/
          retention-days: 30
          if-no-files-found: error

  # gerowallet-e2e-tests' release rehearsal (tests/release/upgrade-recovery.spec.ts), on
  # one disposable profile and without uninstalling: 2.7.2 creates a Midnight wallet
  # (password, then PassKey) and two Cardano wallets through its own UI, the candidate
  # (this run's tested package, the exact bytes) is installed over it with the gpw2
  # migration on, then the recovery package with it off; each stage restarts the browser
  # and checks wallets, addresses, recovery phrase, signing key and backup state. Offline:
  # every request is answered locally, no network or funds are used.
  upgrade-rehearsal:
    name: Upgrade rehearsal (2.7.2 → candidate → recovery)
    needs: [verify, upgrade-fixtures]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      ZIP_SHA256: ${{ needs.verify.outputs.zip_sha256 }}
      EXTENSION_ID: ${{ needs.verify.outputs.extension_id }}
    steps:
      - name: Check the harness token
        env:
          E2E_HARNESS_TOKEN: ${{ secrets.E2E_HARNESS_TOKEN }}
        run: |
          if [ -z "$E2E_HARNESS_TOKEN" ]; then
            echo "::error::The E2E_HARNESS_TOKEN secret is not set: a read-only token for Gero-Labs/gerowallet-e2e-tests (see .github/runbooks/chrome-web-store.md)" >&2
            exit 1
          fi

      - name: Checkout the e2e harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Gero-Labs/gerowallet-e2e-tests
          ref: development
          token: ${{ secrets.E2E_HARNESS_TOKEN }}
          persist-credentials: false

      - name: Checkout this workflow's scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: .release-scripts
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Install the harness
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Download the tested package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gero-extension-${{ github.sha }}
          path: .candidate-artifact

      - name: Download the old and recovery packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: upgrade-*-${{ github.run_id }}
          path: .upgrade

      # The candidate under test is the verified ZIP, extracted, beside the report its
      # build wrote: the rehearsal re-checks every file hash against that report.
      - name: Put the packages under test
        run: |
          zip=".candidate-artifact/release-evidence/Gero-v${RELEASE_VERSION}.zip"
          echo "${ZIP_SHA256}  ${zip}" | sha256sum -c -
          mkdir -p .candidate/extension .candidate/release-evidence
          unzip -q "$zip" -d .candidate/extension
          cp .candidate-artifact/release-evidence/artifact.json .candidate/release-evidence/
          # The next patch, as the recovery build computed it; the rehearsal checks that
          # the recovery package's manifest says exactly this.
          echo "RECOVERY_VERSION=$(node -p "const p = process.argv[1].split('.'); p[p.length - 1] = String(Number(p.at(-1)) + 1); p.join('.')" "$RELEASE_VERSION")" >> "$GITHUB_ENV"
          echo "harness_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run the rehearsal
        run: npm run test:release
        env:
          RELEASE_OLD_EXTENSION_PATH: ${{ github.workspace }}/.upgrade/upgrade-old-${{ github.run_id }}/extension
          RELEASE_EXTENSION_PATH: ${{ github.workspace }}/.candidate/extension
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          RELEASE_RECOVERY_EXTENSION_PATH: ${{ github.workspace }}/.upgrade/upgrade-recovery-${{ github.run_id }}/extension
          RELEASE_RECOVERY_VERSION: ${{ env.RECOVERY_VERSION }}
          RELEASE_RECOVERY_SOURCE_SHA: ${{ github.sha }}
          RELEASE_EXPECTED_EXTENSION_ID: ${{ needs.verify.outputs.extension_id }}

      - name: Check the rehearsal result
        run: |
          node .release-scripts/scripts/chrome-web-store.mjs upgrade-gate --results test-results/release/results.json \
            --wallet-sha "$GITHUB_SHA" --expected-id "$EXTENSION_ID" --version "$RELEASE_VERSION" --recovery-version "$RECOVERY_VERSION"

      # The evidence only: the Playwright traces hold the public test vector's phrase
      # and screenshots, and this repository is public (see the e2e job).
      - name: Keep the rehearsal summary
        if: ${{ !cancelled() }}
        run: |
          mkdir -p upgrade-evidence
          [ -e test-results/release/results.json ] && node --input-type=module - test-results/release/results.json > upgrade-evidence/upgrade-evidence.json <<'NODE' || true
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const tests = [];
          const visit = suite => {
            for (const spec of suite.specs ?? []) for (const test of spec.tests ?? []) {
              const result = test.results?.at(-1);
              const evidence = result?.attachments?.find(item => item.name === 'upgrade-evidence');
              tests.push({ title: spec.title, status: test.status, evidence: evidence?.body ? JSON.parse(Buffer.from(evidence.body, 'base64').toString('utf8')) : null });
            }
            (suite.suites ?? []).forEach(visit);
          };
          (report.suites ?? []).forEach(visit);
          console.log(JSON.stringify({ stats: report.stats, tests }, null, 2));
          NODE
          printf '{"harnessRepository":"Gero-Labs/gerowallet-e2e-tests","harnessSha":"%s","walletSha":"%s","releaseArchiveSha256":"%s"}\n' \
            "${harness_sha:-}" "$GITHUB_SHA" "$ZIP_SHA256" > upgrade-evidence/e2e-run.json
      - name: Upload the rehearsal summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upgrade-rehearsal-${{ inputs.channel }}-${{ inputs.version }}-${{ github.run_id }}
          path: upgrade-evidence/
          retention-days: 90
          if-no-files-found: warn

  submit:
    name: Tag and upload to the Chrome Web Store
    needs: [verify, e2e, upgrade-rehearsal]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewers on this environment approve the release; its vars and secrets
    # are the store credentials for this channel's listing.
    environment: chrome-web-store-${{ inputs.channel }}
    permissions:
      contents: write # the v<version> tag only; see "Tag the release"
      id-token: write # GitHub's OIDC token for "Get a store access token"; no other step uses it
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SUBMISSION: ${{ inputs.submission }}
      DEPLOY_PERCENTAGE: ${{ inputs.deploy_percentage }}
    steps:
      # Only the people named in this environment's CWS_RELEASERS variable may release,
      # whoever approves. GitHub sends a re-run's own starter as the triggering actor, so
      # a re-run is checked too. An unset list releases nothing.
      - name: Check who started the release
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          CWS_RELEASERS: ${{ vars.CWS_RELEASERS }}
        run: |
          set -f
          actor="$(printf '%s' "$TRIGGERING_ACTOR" | tr '[:upper:]' '[:lower:]')"
          releasers="$(printf '%s' "$CWS_RELEASERS" | tr ',' ' ' | tr '[:upper:]' '[:lower:]')"
          for login in $releasers; do
            if [ "$login" = "$actor" ]; then echo "${TRIGGERING_ACTOR} may release"; exit 0; fi
          done
          if [ -z "${releasers// /}" ]; then
            echo "::error::The CWS_RELEASERS variable of this environment is not set, so nobody may release" >&2
          else
            echo "::error::${TRIGGERING_ACTOR} is not in this environment's CWS_RELEASERS and may not release" >&2
          fi
          exit 1

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'

      - name: Download the tested package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gero-extension-${{ github.sha }}
          path: candidate

      - name: Confirm it is the ZIP that was verified
        env:
          ZIP_SHA256: ${{ needs.verify.outputs.zip_sha256 }}
        run: echo "${ZIP_SHA256}  candidate/release-evidence/Gero-v${RELEASE_VERSION}.zip" | sha256sum -c -

      # After approval and before the upload, so an uploaded package always has its tag.
      # A tag already on this commit (from an earlier attempt that failed to upload) is
      # kept, so that attempt can simply be run again. The token is used in this step only.
      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          tag="v${RELEASE_VERSION}"
          if tagged="$(git rev-parse --verify --quiet "refs/tags/${tag}^{commit}")"; then
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::${tag} already marks ${tagged}, not ${GITHUB_SHA}" >&2; exit 1
            fi
            echo "${tag} already marks this commit; keeping it"
            exit 0
          fi
          tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" -f tag="$tag" -f type=commit -f object="$GITHUB_SHA" \
            -f message="GeroWallet ${RELEASE_VERSION} (${CHANNEL}), tested and approved for the Chrome Web Store; workflow ${GITHUB_RUN_ID}" \
            --jq .sha)"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${tag}" -f sha="$tag_object" > /dev/null
          echo "Tagged ${GITHUB_SHA} as ${tag}"

      # Keyless store credentials (Workload Identity Federation): Google trades this job's
      # OIDC token for a one-hour access token of the release service account. Google's
      # provider admits only this repository's jobs in the chrome-web-store-production
      # environment. Without CWS_WIF_PROVIDER the step is skipped, and "Upload and submit"
      # falls back to the CWS_SERVICE_ACCOUNT_JSON or refresh-token secrets. No credentials
      # file is written, so nothing lands in the workspace for a later step to upload.
      - name: Get a store access token
        id: wif
        if: ${{ vars.CWS_WIF_PROVIDER != '' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false

      - name: Upload and submit
        env:
          EXTENSION_ID: ${{ needs.verify.outputs.extension_id }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
          CWS_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token }}
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          mkdir -p store-evidence
          args=(release --zip "candidate/release-evidence/Gero-v${RELEASE_VERSION}.zip" --version "$RELEASE_VERSION"
            --expected-id "$EXTENSION_ID" --submission "$SUBMISSION" --report store-evidence/submission.json)
          if [ -n "$DEPLOY_PERCENTAGE" ]; then args+=(--deploy-percentage "$DEPLOY_PERCENTAGE"); fi
          node scripts/chrome-web-store.mjs "${args[@]}"

      # The report holds store states and versions only: no token or credential.
      - name: Keep the store's answer
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: chrome-web-store-${{ inputs.channel }}-${{ inputs.version }}-${{ github.run_id }}
          path: store-evidence/
          retention-days: 90
          if-no-files-found: warn

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';
          const file = 'store-evidence/submission.json';
          if (!fs.existsSync(file)) { console.log('### Nothing reached the Chrome Web Store'); process.exit(0); }
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (!report.ok) { console.log(`### Chrome Web Store step failed\n\n${report.error}`); process.exit(0); }
          const next = {
            staged: 'In review. Once approved, publish it from the Developer Dashboard.',
            publish: 'In review. It goes live as soon as it is approved.',
            'upload-only': 'Saved as a draft. Nothing was submitted for review.',
          }[report.submission];
          console.log(`### Gero ${report.version} uploaded to the Chrome Web Store\n`);
          console.log(`Item \`${report.itemId}\`, submission state: ${report.submissionState ?? 'none'}.\n\n${next}`);
          NODE
