name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    if: github.event.pull_request.user.login != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            You are reviewing a pull request for a Cardano blockchain wallet Chrome extension (Manifest V3, Vue 2.7 + TypeScript).
            Read CLAUDE.md first for project conventions and architecture.

            IMPORTANT: Focus ONLY on the files changed in this PR. Do NOT review the entire codebase.
            Use `git diff origin/development...HEAD` to see exactly what changed.
            Post your review as a single comment on the PR.

            Review the PR changes focusing on:

            **Bugs & Correctness**
            - Race conditions (especially in cross-context messaging, store sync, async operations)
            - Unhandled promise rejections or missing error handling
            - Incorrect Chrome extension context usage (background vs browser vs popup)
            - State management issues (stale data, missing reactivity)

            **Security** (this is a financial wallet — security is critical)
            - Private key / mnemonic exposure in logs, storage, or messaging
            - XSS, injection, or unsafe data handling
            - Unsafe Chrome messaging patterns
            - Missing input validation at system boundaries

            **Performance**
            - Blocking operations on login or UI thread
            - Unnecessary re-renders or redundant API calls
            - Missing lazy loading for heavy components

            **Code Quality**
            - i18n: All user-facing text must use $t() with keys in both us.ts and de.ts
            - Dead code, unused imports, or duplicate logic
            - Consistent patterns with existing codebase (stores, messaging, database access)

            **Guidelines**
            - Be specific: reference file paths and line numbers
            - Separate issues by severity: bugs > security > performance > style
            - Don't nitpick formatting or suggest changes unrelated to the PR's intent
            - If the PR is solid, say so briefly — don't manufacture issues