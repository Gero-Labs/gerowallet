name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # Same-repo guard: fork PRs don't receive repository secrets, so
    # CLAUDE_CODE_OAUTH_TOKEN resolves empty and the job would fail on every
    # external PR. Skip fork PRs instead of failing them (matches dev-bundle-gate.yml).
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository

    # GitHub-hosted: public repo can't use the self-hosted arc-private runner
    # group (allows_public_repositories:false). See dev-bundle-gate.yml.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      # Without node_modules the reviewer can only READ code: every attempt to
      # run vitest or eslint dies, and the review silently degrades into "I
      # couldn't execute anything, trusting the PR description". Install first
      # so its verdicts are backed by runs (matches dev-bundle-gate.yml).
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Guards the failure in issue #1053: the action can exit 0 having left
      # only an unfinished progress comment. Record what exists now so the
      # verification step below can tell a finished review from that.
      # claude-code-action refuses to run when the PR edits this workflow file
      # ("the workflow file must [...] have identical content to the version on
      # the repository's default branch") — a deliberate guard against a PR
      # rewriting the reviewer that reviews it. The action then exits 0 having
      # posted nothing, which is indistinguishable from the #1053 failure the
      # gate below looks for. Detect that case instead of red-flagging it.
      - name: Does this PR change the review workflow itself?
        id: selfedit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr diff ${{ github.event.pull_request.number }} --name-only \
               | grep -qx '.github/workflows/claude-code-review.yml'; then
            echo "skip_gate=true" >> "$GITHUB_OUTPUT"
            echo "This PR edits the review workflow, so the action will skip itself; the completion gate cannot apply."
          else
            echo "skip_gate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Snapshot review comments before the run
        id: before
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '[.[] | select(.user.login | test("claude"; "i")) | .id] | max // 0')
          echo "latest_id=${latest}" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@56cf60fde42f7b19c3abfd5c9c48b69a1288461f # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(npx vitest run:*),Bash(npx eslint:*),Bash(node scripts/design/audit.mjs:*),Bash(node scripts/design/contrast.mjs:*),Read,Glob,Grep"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for a Cardano blockchain wallet Chrome extension (Manifest V3, Vue 2.7 + TypeScript).
            Read CLAUDE.md first for project conventions and architecture.

            Focus ONLY on the files changed in this PR. Do NOT review the entire codebase.

            Do the whole review yourself, in this session. Do NOT delegate to
            subagents: their results are not awaited here, which has produced
            runs that exited green having posted only a half-written comment.

            VERIFY, DON'T ASSUME. Dependencies are installed, so run the checks
            that bear on the changed files and report what you actually observed:
            - `npx vitest run <spec paths>` for specs covering the changed code
              (pass explicit paths; do not run the whole suite)
            - `npx eslint <changed files>` for changed .ts/.vue files
            - `node scripts/design/audit.mjs` and `node scripts/design/contrast.mjs`
              when styles, tokens or .vue files changed
            Never state that something passes without having run it, and never
            accept the PR description's reported results in place of running
            them. If a command is denied or fails to run, say so explicitly in
            your comment rather than reviewing around it.

            Review the PR changes focusing on:

            **Bugs & Correctness**
            - Race conditions (especially in cross-context messaging, store sync, async operations)
            - Unhandled promise rejections or missing error handling
            - Incorrect Chrome extension context usage (background vs browser vs popup)
            - State management issues (stale data, missing reactivity)

            **Security** (this is a financial wallet — security is critical)
            - Private key / mnemonic exposure in logs, storage, or messaging
            - XSS, injection, or unsafe data handling
            - Unsafe Chrome messaging patterns
            - Missing input validation at system boundaries

            **Performance**
            - Blocking operations on login or UI thread
            - Unnecessary re-renders or redundant API calls
            - Missing lazy loading for heavy components

            **Code Quality**
            - i18n: All user-facing text must use $t() with keys in both us.ts and de.ts
            - Dead code, unused imports, or duplicate logic
            - Consistent patterns with existing codebase (stores, messaging, database access)

            **Guidelines**
            - Be specific: reference file paths and line numbers
            - Separate issues by severity: bugs > security > performance > style
            - Don't nitpick formatting or suggest changes unrelated to the PR's intent
            - If the PR is solid, say so briefly — don't manufacture issues

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.

      # Issue #1053: the action reported success while the review was still
      # unfinished, leaving a progress comment with unticked boxes and no
      # findings. A green check has to mean a review was actually posted, so
      # assert that here rather than trusting the action's exit code.
      - name: Verify a finished review was posted
        if: steps.selfedit.outputs.skip_gate != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '[.[] | select(.user.login | test("claude"; "i"))] | last // {}')
          id=$(printf '%s' "$latest" | jq -r '.id // 0')
          body=$(printf '%s' "$latest" | jq -r '.body // ""')

          if [ -z "$body" ]; then
            echo "::error::Claude review job finished without posting any comment."
            exit 1
          fi

          # A comment left over from an earlier run must not satisfy this gate:
          # require one created by THIS run.
          if [ "$id" -le "${{ steps.before.outputs.latest_id }}" ]; then
            echo "::error::No new review comment from this run (newest id ${id} predates it). Failing rather than reporting a review that did not happen."
            exit 1
          fi

          # The tracking comment renders its todo list as markdown checkboxes.
          # Any still unticked means the run stopped mid-review.
          if printf '%s' "$body" | grep -qE '^[[:space:]]*-[[:space:]]\[[[:space:]]\]'; then
            echo "::error::Review comment still has unfinished items - the review did not complete."
            printf '%s\n' "$body" | grep -E '^[[:space:]]*-[[:space:]]\[[[:space:]]\]' || true
            exit 1
          fi

          echo "Finished review comment present ($(printf '%s' "$body" | wc -c) bytes)."
