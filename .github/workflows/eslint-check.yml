name: ESLint Config Gate

# Guards against the ESLint flat-config silently failing to load — the exact
# break this workflow was added for: eslint.config.mjs does
# `import vue from 'eslint-plugin-vue'`, which needs eslint-plugin-vue >=9 for
# flat-config support, but package-lock had it pinned at 8.7.1 (no flat export).
# Every `git commit` then died in its pre-commit hook with
# "Cannot find package '.../eslint-plugin-vue/index.js'", so the whole team
# committed with --no-verify. There was no ESLint job in CI, so it went
# unnoticed for a long time.
#
# What this job does: it installs from the lockfile and resolves the full flat
# config via `eslint --print-config`, which instantiates every plugin exactly as
# a real lint run would, so a plugin that is missing / on an incompatible major /
# renamed fails here with a clear message. It then lints the whole repository
# and typechecks it with vue-tsc. Both were red with legacy debt until #1313
# cleared it (2026-11); from then on any new ESLint error or type error fails
# the PR. The pre-commit hook (scripts/precommit-lint.mjs) still lints staged
# files locally. The job keeps its original name because branch protection
# requires it by that name.
#
# Secret-free by design (contents: read, --ignore-scripts), like
# lockfile-check.yml, so it runs on every PR including Dependabot's.

on:
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - development

permissions:
  contents: read

concurrency:
  group: eslint-config-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint-config:
    name: ESLint flat config loads
    # Fork PRs run here too — see the note in dev-bundle-gate.yml for why the
    # same-repo guard was dropped. Nothing runs on shared infra any more: this is
    # a disposable hosted runner with a read-only token.
    # GitHub-hosted: the repo is public and the self-hosted arc-private runner
    # group forbids public-repo jobs (allows_public_repositories:false).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: 'npm'

      # Installs eslint + eslint-plugin-vue at the locked versions. If the lock
      # and the flat config disagree (the original break), the next step throws.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Resolves eslint.config.mjs end to end, loading every referenced plugin.
      # Fails on a broken/missing/incompatible plugin; unaffected by the legacy
      # no-explicit-any debt because no file bodies are linted here. Checked for
      # both a .vue and a .ts path so a rule/plugin that only breaks resolving
      # one file type is still caught.
      - name: Verify flat config resolves
        run: |
          npx eslint --print-config src/options/App.vue > /dev/null
          npx eslint --print-config src/utils/debug.ts > /dev/null

      # The whole repository, not only changed files: the legacy debt is gone
      # (#1313), so zero errors is the baseline to hold.
      - name: Lint the repository
        run: npx eslint .

      - name: Typecheck (vue-tsc)
        run: npm run typecheck
