name: Midnight ledger compatibility

on:
  # Deliberately NOT path-filtered. This job is a required check, and a
  # path-filtered workflow never reports a status on PRs that miss its filter —
  # GitHub then waits forever for a check that will never arrive, leaving those
  # PRs permanently unmergeable. It also has to run everywhere to be worth
  # requiring: the break it caught most recently (PR 1084, a lockfile-only
  # dependency bump that split the ledger WASM module in two) passed npm ci,
  # the production bundle and ESLint while the shielded send path was broken.
  # Keep the trigger broad; the cost is one job on PRs that cannot fail it.
  pull_request:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: midnight-ledger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Ledger tests and extension bundles
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.11.0'
          cache: npm
      - run: npm ci
      - name: Test both ledger lines and transaction orchestration
        run: npx vitest run src/chains/midnight src/services/midnight-tx.ledger.spec.ts src/services/__tests__/midnightTxPerToken.test.ts src/services/__tests__/midnightSyncStatus.test.ts src/services/__tests__/midnightResumeCursor.test.ts src/services/crossDevice src/stores/midnightStore.spec.ts src/shared/composables/useMidnightDustLive.spec.ts
      - name: Build every production extension entry point
        run: node scripts/build-isolated-extension.mjs .

      - name: Install isolated Help browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/help-browser" --no-audit --no-fund --ignore-scripts playwright@1.61.0
          node "$RUNNER_TEMP/help-browser/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Help browser acceptance with synthetic API fixtures
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/help-browser/node_modules/playwright
          HELP_SMOKE_OUTPUT: ${{ runner.temp }}/help-browser-evidence
        run: |
          node scripts/help-browser/foundation-smoke.cjs
          node scripts/help-browser/published-smoke.cjs
          node scripts/help-browser/updates-smoke.cjs

      - name: Upload reproducible Help browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: help-browser-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/help-browser-evidence
          if-no-files-found: warn
          retention-days: 30
