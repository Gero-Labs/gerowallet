name: Midnight ledger compatibility

on:
  pull_request:
    branches: [development, main]
    paths:
      - 'src/chains/midnight/**'
      - 'src/chrome/background.ts'
      - 'src/chrome/walletBg.ts'
      - 'src/services/midnight-tx*'
      - 'src/services/midnight-sync.service.ts'
      - 'src/services/websocket.service.ts'
      - 'src/services/__tests__/midnight*.test.ts'
      - 'src/modules/navigation/layouts/ContentLayout.vue'
      - 'src/stores/midnightStore.ts'
      - 'src/stores/midnightStore.spec.ts'
      - 'src/shared/composables/useMidnightDustLive*'
      - 'src/modules/midnight/ProofServerPage.vue'
      - 'src/types/midnight-v9-shielded.d.ts'
      - 'src/modules/dashboard/components/Midnight*.vue'
      - 'src/modules/dashboard/dialogs/Midnight*.vue'
      - 'src/modules/dashboard/dialogs/Shield*.vue'
      - 'src/sidepanel/components/flows/MidnightSendSheet.vue'
      - 'src/services/walletManager.service.ts'
      - 'src/services/crossDevice/localProverProfile*'
      - 'package*.json'
      - 'vite.config.*'
      - 'scripts/build-isolated-extension.mjs'
      - '.github/workflows/midnight-ledger-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: midnight-ledger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Ledger tests and extension bundles
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.11.0'
          cache: npm
      - run: npm ci
      - name: Test both ledger lines and transaction orchestration
        run: npx vitest run src/chains/midnight src/services/midnight-tx.ledger.spec.ts src/services/__tests__/midnightTxPerToken.test.ts src/services/__tests__/midnightSyncStatus.test.ts src/services/__tests__/midnightResumeCursor.test.ts src/services/crossDevice src/stores/midnightStore.spec.ts src/shared/composables/useMidnightDustLive.spec.ts
      - name: Build every production extension entry point
        run: node scripts/build-isolated-extension.mjs .
