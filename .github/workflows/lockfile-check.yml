name: Lockfile Check

# Validates that package.json and package-lock.json stay in sync.
#
# Why this exists separately from ci-cd.yml: the main build job only triggers on
# push to `main` and materializes .env.production from repo secrets, which
# Dependabot PRs cannot access. This job is secret-free and runs `npm ci` (which
# fails if the lock is out of sync) on every PR and on every push to development
# — so post-squash-merge drift (the recurring "Missing: sass... from lock file"
# break) is caught immediately instead of days later in a local checkout.

on:
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - development

permissions:
  contents: read

jobs:
  lockfile:
    name: npm ci (lock in sync)
    # Same-repo guard (matches dev-bundle-gate.yml): don't pull fork-controlled
    # trees onto the shared self-hosted runner. --ignore-scripts already blocks
    # lifecycle execution, but the guard keeps protection on the job not running
    # rather than on a single load-bearing flag. Dependabot branches are same-repo.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # GitHub-hosted: public repo can't use the self-hosted arc-private runner
    # group (allows_public_repositories:false). See dev-bundle-gate.yml.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.11.0'

      - name: Upgrade npm
        run: npm install --global npm@11.1.0

      # `npm ci` exits non-zero when package.json and package-lock.json disagree.
      # --ignore-scripts keeps it fast and avoids needing build secrets/toolchains.
      - name: Verify lockfile is in sync
        run: npm ci --ignore-scripts
