name: Dev Quality Gate

# Pre-merge code gate for PRs targeting `development` (and `main`).
#
# Why this exists: ci-cd.yml only builds on push to `main`, so type errors, lint
# breaks, and — critically — Vue SFC *syntax* errors were reaching `development`
# uncaught and only surfaced after merge to main. (vue-tsc is not an option here:
# Vue 2.7 + TS 5.8 has no compatible vue-tsc — 1.x caps at ~TS 5.4, 2.x+ dropped
# Vue 2. The vite bundle parse is what actually catches SFC syntax errors.)
#
# Secret-free by design: it materializes a placeholder .env.production from the
# committed .env.example (VITE_* values are runtime strings, not build secrets),
# so Dependabot/fork PRs run it too — same rationale as lockfile-check.yml.

on:
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - development

permissions:
  contents: read

# One in-flight run per branch; newer pushes cancel stale runs.
concurrency:
  group: dev-quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type check, lint, bundle
    runs-on: gero-plain
    env:
      NODE_OPTIONS: "--max-old-space-size=6144 --max-semi-space-size=256"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (.ts)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Placeholder env: VITE_* are inlined runtime strings, so a bundle parse
      # needs no real secrets. This is the step that catches Vue SFC syntax
      # errors — vite parses every single-file component.
      - name: Bundle check (placeholder env)
        run: |
          cp .env.example .env.production
          echo "Wrote placeholder .env.production ($(grep -c '^VITE_' .env.production) vars)"
          npm run build
