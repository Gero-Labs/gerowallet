name: Chrome Extension CI/CD

on:
  push:
    branches:
      - main
  # Builds, tests and archives a candidate. Nothing here tags or releases it: that is
  # "Chrome Web Store release" (chrome-web-store.yml), whose first job calls this workflow.
  workflow_dispatch:
    inputs:
      expected_version:
        description: 'Reviewed package version already committed in package.json and package-lock.json'
        type: string
        required: true
  # A call reports its caller's event (workflow_dispatch), so it is checked as a manual
  # release: version, MANIFEST_KEY and CHROME_EXTENSION_ID.
  workflow_call:
    inputs:
      expected_version:
        type: string
        required: true
    secrets:
      MANIFEST_KEY:
        required: false
      VITE_MOONPAY_API_KEY:
        required: false
      VITE_GUARDARIAN_API_KEY:
        required: false
permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.candidate.outputs.version }}
    env:
      NODE_OPTIONS: "--max-old-space-size=4096 --max-semi-space-size=128"
      MANIFEST_KEY: ${{ vars.MANIFEST_KEY || secrets.MANIFEST_KEY }}
      EXPECTED_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'

      - name: Upgrade npm
        run: npm install --global npm@11.1.0

      - name: Install dependencies
        run: npm ci

      - name: Verify reviewed candidate version and identity configuration
        id: candidate
        env:
          REQUESTED_VERSION: ${{ inputs.expected_version }}
          MANUAL_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+(?:\.\d+)?$/.test(pkg.version)) throw new Error('Candidate needs a Chrome-compatible version');
          if (lock.version !== pkg.version || lock.packages[''].version !== pkg.version) throw new Error('Package and lockfile versions differ');
          if (process.env.MANUAL_RELEASE === 'true') {
            if (process.env.REQUESTED_VERSION !== pkg.version) throw new Error('Requested release version is not the reviewed package version');
            if (!process.env.MANIFEST_KEY || !/^[a-p]{32}$/.test(process.env.EXPECTED_EXTENSION_ID || '')) throw new Error('Manual release requires MANIFEST_KEY and CHROME_EXTENSION_ID');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkg.version}\n`);
          NODE

      - name: Test the candidate
        run: npm test -- --maxWorkers=2

      # Materialize .env.production from repo Variables/Secrets so the shipped
      # build's config comes from ONE controlled source instead of a
      # per-developer gitignored .env.production (which drifts — a stale machine
      # would ship e.g. the wrong VITE_NEXUS_URL). Values are passed through env:
      # and written to the file via $VAR (never interpolated into the shell), so
      # a value cannot inject commands. Registered secrets are masked in logs and
      # only written to the file, never echoed.
      - name: Write production env
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_NEXUS_URL: ${{ vars.VITE_NEXUS_URL }}
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          VITE_ADA_HANDLE_BASE_URL: ${{ vars.VITE_ADA_HANDLE_BASE_URL }}
          VITE_FLAGS_BASE_URL: ${{ vars.VITE_FLAGS_BASE_URL }}
          VITE_SYNC_WS_URL: ${{ vars.VITE_SYNC_WS_URL }}
          VITE_KAISEREX_OAUTH_URL: ${{ vars.VITE_KAISEREX_OAUTH_URL }}
          VITE_KRAKEN_API_URL: ${{ vars.VITE_KRAKEN_API_URL }}
          VITE_KRAKEN_WS_URL: ${{ vars.VITE_KRAKEN_WS_URL }}
          VITE_ZKFOLD_API_URL: ${{ vars.VITE_ZKFOLD_API_URL }}
          VITE_ZKFOLD_PROVER_URL: ${{ vars.VITE_ZKFOLD_PROVER_URL }}
          VITE_CASHBACK_ENVIRONMENT: ${{ vars.VITE_CASHBACK_ENVIRONMENT }}
          VITE_CASHBACK_IDENTIFIER: ${{ vars.VITE_CASHBACK_IDENTIFIER }}
          VITE_IS_BETA: ${{ vars.VITE_IS_BETA }}
          VITE_CIP45_DEFAULT_ENABLED: ${{ vars.VITE_CIP45_DEFAULT_ENABLED }}
          VITE_USE_MOCK_PROOF: ${{ vars.VITE_USE_MOCK_PROOF }}
          VITE_MOONPAY_API_KEY: ${{ secrets.VITE_MOONPAY_API_KEY }}
          VITE_GUARDARIAN_API_KEY: ${{ secrets.VITE_GUARDARIAN_API_KEY }}
        run: |
          {
            echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
            echo "VITE_NEXUS_URL=$VITE_NEXUS_URL"
            echo "VITE_BACKEND_URL=$VITE_BACKEND_URL"
            echo "VITE_APP_NAME=$VITE_APP_NAME"
            echo "VITE_ADA_HANDLE_BASE_URL=$VITE_ADA_HANDLE_BASE_URL"
            echo "VITE_FLAGS_BASE_URL=$VITE_FLAGS_BASE_URL"
            echo "VITE_SYNC_WS_URL=$VITE_SYNC_WS_URL"
            echo "VITE_KAISEREX_OAUTH_URL=$VITE_KAISEREX_OAUTH_URL"
            echo "VITE_KRAKEN_API_URL=$VITE_KRAKEN_API_URL"
            echo "VITE_KRAKEN_WS_URL=$VITE_KRAKEN_WS_URL"
            echo "VITE_ZKFOLD_API_URL=$VITE_ZKFOLD_API_URL"
            echo "VITE_ZKFOLD_PROVER_URL=$VITE_ZKFOLD_PROVER_URL"
            echo "VITE_CASHBACK_ENVIRONMENT=$VITE_CASHBACK_ENVIRONMENT"
            echo "VITE_CASHBACK_IDENTIFIER=$VITE_CASHBACK_IDENTIFIER"
            echo "VITE_IS_BETA=$VITE_IS_BETA"
            echo "VITE_CIP45_DEFAULT_ENABLED=$VITE_CIP45_DEFAULT_ENABLED"
            # Pinned off: debugLog() output includes wallet records, unlock
            # responses and PRF metadata, so a release must never enable it.
            echo "VITE_DEBUG_STORES=false"
            echo "VITE_USE_MOCK_PROOF=$VITE_USE_MOCK_PROOF"
            echo "VITE_MOONPAY_API_KEY=$VITE_MOONPAY_API_KEY"
            echo "VITE_GUARDARIAN_API_KEY=$VITE_GUARDARIAN_API_KEY"
          } > .env.production
          echo "Wrote .env.production ($(grep -c '^VITE_' .env.production) vars)"

      # A build that cannot open the gpw2 secret envelope locks out every wallet
      # already migrated to it. Refuse to produce one (e.g. a rollback cut from an
      # old ref). See .github/runbooks/secret-envelope.md.
      - name: Secret envelope readers present
        run: node scripts/check-secret-envelope-readers.mjs

      - name: Build Chrome Extension
        run: |
          mkdir -p release-evidence
          node --input-type=module <<'NODE' > release-evidence/build-runtime.json
          import os from 'node:os';
          import v8 from 'node:v8';
          console.log(JSON.stringify({ node: process.version, nodeOptions: process.env.NODE_OPTIONS, heapLimitBytes: v8.getHeapStatistics().heap_size_limit, systemMemoryBytes: os.totalmem() }, null, 2));
          NODE
          /usr/bin/time --verbose --output=release-evidence/build-resources.txt npm run build

      - name: Verify and archive the exact built candidate
        env:
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
          VITE_IS_BETA: ${{ vars.VITE_IS_BETA }}
        run: |
          mkdir -p release-evidence
          identity_args=()
          if [ -n "$EXPECTED_EXTENSION_ID" ]; then identity_args=(--expected-id "$EXPECTED_EXTENSION_ID"); fi
          node scripts/check-release-artifact.mjs extension --expected-version "$CANDIDATE_VERSION" "${identity_args[@]}" --report release-evidence/artifact.json
          node scripts/check-bundle-tdz.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('release-evidence/artifact.json', 'utf8'));
          Object.assign(report, { sourceSha: process.env.GITHUB_SHA, workflowRun: process.env.GITHUB_RUN_ID, channel: process.env.VITE_IS_BETA === 'true' ? 'beta' : 'production' });
          fs.writeFileSync('release-evidence/artifact.json', JSON.stringify(report, null, 2) + '\n');
          NODE
          (cd extension && zip -qr "../release-evidence/Gero-v${CANDIDATE_VERSION}.zip" .)
          (cd release-evidence && sha256sum "Gero-v${CANDIDATE_VERSION}.zip" > SHA256SUMS)

      # Upload the built extension (./extension is gitignored). The store release
      # downloads this artifact later in the same run and uploads its ZIP as it is.
      - name: Upload extension build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gero-extension-${{ github.sha }}
          path: |
            extension/
            release-evidence/
          retention-days: 90
          if-no-files-found: error

      # Preserve diagnostics even when a build or validation gate fails. This
      # artifact contains reports only, never an unvalidated extension or ZIP.
      - name: Upload build diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gero-build-diagnostics-${{ github.sha }}
          path: |
            release-evidence/build-runtime.json
            release-evidence/build-resources.txt
            release-evidence/artifact.json
          retention-days: 90
          if-no-files-found: warn

