name: "✨ Feature request"
description: Suggest an idea or improvement for Gero Wallet
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Gero Wallet. Please describe the problem before the solution.
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The user need or pain point. "As a user, I want … so that …"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Wallet / accounts
        - Staking / governance
        - Swap / DeFi
        - NFTs / tokens
        - DApp connector (CIP-30)
        - Hardware wallet
        - Multi-chain (Bitcoin / Midnight)
        - Other
    validations:
      required: false
