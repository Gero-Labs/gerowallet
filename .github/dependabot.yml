# Dependabot configuration for Gero Wallet
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    # Group all non-major updates into a single PR
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Assign reviewers and labels
    reviewers:
      - "dudiedri"  # Update with actual GitHub usernames
    labels:
      - "dependencies"
      - "automated"
    # Allow only direct updates, no increase in transitive dependencies
    allow:
      - dependency-type: "direct"
    # Coupled peer conflict: @zxing/browser@0.2.0 requires @zxing/library ~0.22.x,
    # but dependabot wants @zxing/library 0.23.0 — bumping either alone fails
    # `npm ci` with ERESOLVE, and they cannot both advance to those versions
    # together. Ignore both until @zxing/browser ships a release whose peer
    # range accepts @zxing/library 0.23+, then remove these and bump as a pair.
    ignore:
      - dependency-name: "@zxing/browser"
      - dependency-name: "@zxing/library"
      # Exact peer pin: @babylonlabs-io/btc-staking-ts declares
      # `peerDependencies: { "bitcoinjs-lib": "6.1.7" }` — a single version, not
      # a range — so nothing above 6.1.7 is installable while BTC staking is a
      # dependency. A bump makes the tree unresolvable and every CI job dies in
      # `npm ci` with ERESOLVE, which looks exactly like ordinary lockfile drift
      # but is not fixed by re-locking (see PR 1077). Lift this once Babylon
      # widens its peer range.
      - dependency-name: "bitcoinjs-lib"
        versions: [">6.1.7"]
      # Suppress all npm major-version bumps. We never auto-adopt them — every
      # major (vue-router, @vueuse, vitest, cbor/cborg, eslint, etc.) is closed
      # on sight because the Vue 2 / Cardano-serialization stack needs a manual,
      # tested upgrade. Minor/patch (the grouped PR) and security updates still
      # flow. Bump a major deliberately when doing the upgrade work.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Security updates should be created immediately
    commit-message:
      prefix: "chore"
      include: "scope"
    
  # Enable GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    labels:
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "ci"
      include: "scope"