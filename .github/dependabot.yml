# Dependabot configuration for Gero Wallet
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    # Group all non-major updates into a single PR
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Assign reviewers and labels
    reviewers:
      - "dudiedri"
    labels:
      - "dependencies"
      - "automated"
    # Propose direct dependency updates; their lockfile changes can update transitives
    allow:
      - dependency-type: "direct"
    # Coupled peer conflict: @zxing/browser@0.2.0 requires @zxing/library ~0.22.x,
    # but dependabot wants @zxing/library 0.23.0 — bumping either alone fails
    # `npm ci` with ERESOLVE, and they cannot both advance to those versions
    # together. Ignore both until @zxing/browser ships a release whose peer
    # range accepts @zxing/library 0.23+, then remove these and bump as a pair.
    ignore:
      - dependency-name: "@zxing/browser"
      - dependency-name: "@zxing/library"
      # Exact peer pin: @babylonlabs-io/btc-staking-ts declares
      # `peerDependencies: { "bitcoinjs-lib": "6.1.7" }` — a single version, not
      # a range — so nothing above 6.1.7 is installable while BTC staking is a
      # dependency. A bump makes the tree unresolvable and every CI job dies in
      # `npm ci` with ERESOLVE, which looks exactly like ordinary lockfile drift
      # but is not fixed by re-locking (see PR 1077). Lift this once Babylon
      # widens its peer range.
      - dependency-name: "bitcoinjs-lib"
        versions: [">6.1.7"]
      # Coupled WASM pin, and it fails QUIETLY. Four sibling packages —
      # wallet-sdk-address-format, -dust-wallet, -shielded and
      # -unshielded-wallet, aliased here as midnight-v9-* — each declare
      # `"@midnightntwrk/ledger-v9": "1.0.0-rc.3"` as an exact dependency, so
      # npm cannot dedupe them. Bumping the root alone does not move them; it
      # nests a second copy, and ledger-v9 ships a wasm-bindgen module. Two
      # instances means two linear memories and two sets of generated classes,
      # so objects minted by one fail `instanceof` inside the other:
      # midnightLedger9.ts and midnightPrivateSync.ts import both sides, and
      # the real-SDK shielded suite then fails 12/12 with "expected instance of
      # ZswapSecretKeys" (PR 1084). Unlike the bitcoinjs-lib peer pin above,
      # this is a regular dependency, so npm nests silently instead of raising
      # ERESOLVE. The required Ledger tests and extension bundles job exercises it.
      # Bump all five together once the betas repin, then drop this entry.
      - dependency-name: "@midnightntwrk/ledger-v9"
      # Keep Vitest and @vitest/ui majors coordinated with Vue 3, Vite 7,
      # plugins and Node 24. Review as a manual coupled upgrade.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/ui"
        update-types: ["version-update:semver-major"]
      # Review major upgrades manually against the current Vue 3/Vite 7 and
      # chain SDK stack. Grouped minor/patch updates still require normal CI.
      # See MAINTENANCE.md for coupled pins and advisory triage.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Security-update enablement is controlled separately in repository settings
    commit-message:
      prefix: "chore"
      include: "scope"
    
  # Enable GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    labels:
      - "github-actions"
      - "automated"
    # Mirror of the npm major suppression above, which only covers that
    # ecosystem — without this, Actions majors arrive unfiltered (seen with
    # actions/checkout 5 -> 7 and actions/setup-node 5 -> 7 on the same day).
    # An Actions major can change the action's Node runtime or drop inputs, and
    # these workflows are the merge gates, so each one gets a deliberate review:
    # confirm the pinned SHA really is the claimed tag, and diff the action's
    # inputs before adopting it. Minor/patch still flow.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "ci"
      include: "scope"