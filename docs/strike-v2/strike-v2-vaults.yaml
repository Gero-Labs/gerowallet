openapi: 3.0.3
info:
  title: Strike Vault API
  description: Read-only endpoints for Strike V2 vaults.
  version: 1.0.0

servers:
  - url: https://api.strike.finance
    description: Production
  - url: https://api-v2-testnet.strikefinance.org
    description: Testnet

tags:
  - name: Vaults (Public)
    description: Public vault endpoints — no authentication required.
  - name: Vaults (Authenticated)
    description: User-specific vault endpoints — API Wallet auth required.

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
security: []

components:
  securitySchemes:
    ApiWalletAuth:
      type: apiKey
      in: header
      name: X-Api-Wallet-Public-Key
      description: >
        Ed25519 public key of an authorised API wallet.
        Must be accompanied by `X-Api-Wallet-Signature`,
        `X-Api-Wallet-Signature-Timestamp`, and `X-Api-Wallet-Nonce` headers.

  # -------------------------------------------------------------------------
  # Reusable parameters
  # -------------------------------------------------------------------------
  parameters:
    VaultIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Vault UUID.

    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
      description: Maximum number of results to return.

    OffsetQuery:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Number of results to skip (for pagination).

    PeriodQuery:
      name: period
      in: query
      required: false
      schema:
        type: string
        enum: ["24h", "7d", "30d", "6m", "1y", "all"]
        default: "30d"
      description: Time period for metrics calculation.

    VaultIdQuery:
      name: vault_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: Filter by vault UUID.

    HistoryTypeQuery:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum: ["deposit", "withdrawal"]
      description: Filter history entries by type.

    HistoryStatusQuery:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: ["completed", "pending", "cancelled", "failed"]
      description: Filter history entries by status.

  # -------------------------------------------------------------------------
  # Schemas
  # -------------------------------------------------------------------------
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.

    VaultInfoResponse:
      type: object
      required:
        - vault_id
        - type
        - name
        - account_id
        - leader_account_id
        - leader_commission_bps
        - total_shares
        - share_price
        - equity
        - min_leader_share_pct
        - lockup_days
        - min_deposit
        - allow_proportional_close
        - status
        - is_verified
        - created_at
        - all_time_pnl
        - return_24h
        - period_return
        - depositors
        - fee_earned
      properties:
        vault_id:
          type: string
          format: uuid
        type:
          type: string
          enum: ["protocol", "user"]
        name:
          type: string
        description:
          type: string
        account_id:
          type: string
          description: Vault's trading account ID.
        leader_account_id:
          type: string
          description: Leader who can trade on behalf of the vault.
        leader_commission_bps:
          type: integer
          description: Performance fee in basis points (1000 = 10%).
        total_shares:
          type: string
          description: Total shares outstanding (decimal string).
        share_price:
          type: string
          description: Current share price (equity / total_shares).
        equity:
          type: string
          description: Total vault equity (balance + unrealized PnL).
        min_leader_share_pct:
          type: integer
          description: Minimum percentage the leader must hold.
        lockup_days:
          type: integer
          description: Withdrawal lock-up period in days.
        min_deposit:
          type: string
          description: Minimum deposit amount in USD (decimal string).
        allow_proportional_close:
          type: boolean
          description: Whether positions are closed proportionally on withdrawal.
        status:
          type: string
          enum: ["active", "paused", "closed"]
        is_verified:
          type: boolean
          description: Whether the vault is verified by admin.
        created_at:
          type: integer
          format: int64
          description: Creation timestamp in milliseconds.
        apr:
          type: string
          description: Annualised percentage rate (%).
        all_time_pnl:
          type: string
          description: All-time profit and loss (decimal string).
        return_24h:
          type: string
          description: 24-hour return percentage.
        period_return:
          type: string
          description: Return percentage for the selected period.
        depositors:
          type: integer
          description: Number of unique depositors.
        fee_earned:
          type: string
          description: Total fees earned in USD (decimal string).
        sharpe_ratio:
          type: string
          nullable: true
          description: Annualised Sharpe ratio for the selected period.

    VaultListResponse:
      type: object
      required: [vaults, count, limit, offset]
      properties:
        vaults:
          type: array
          items:
            $ref: "#/components/schemas/VaultInfoResponse"
        count:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    VaultPortfolioResponse:
      type: object
      required:
        - vault_id
        - total_value_locked
        - apr
        - all_time_pnl
        - return_24h
        - period_return
        - volume
        - depositors
        - fee
        - fee_earned
        - created_at
        - history
      properties:
        vault_id:
          type: string
          format: uuid
        total_value_locked:
          type: string
          description: Current TVL in USD (decimal string).
        apr:
          type: string
          description: Annualised percentage rate (%).
        all_time_pnl:
          type: string
          description: All-time profit and loss.
        return_24h:
          type: string
          description: 24-hour return percentage.
        period_return:
          type: string
          description: Return percentage for the selected period.
        volume:
          type: string
          description: Trading volume for the selected period.
        depositors:
          type: integer
          description: Number of unique depositors.
        fee:
          type: string
          description: Vault fee percentage.
        fee_earned:
          type: string
          description: Total fees earned in USD.
        sharpe_ratio:
          type: string
          nullable: true
          description: Annualised Sharpe ratio or null.
        max_drawdown:
          type: string
          nullable: true
          description: Maximum peak-to-trough drawdown percentage or null.
        created_at:
          type: integer
          format: int64
          description: Vault creation timestamp in milliseconds.
        history:
          type: array
          description: "Time-series data: each element is [timestamp, tvl, pnl, feesEarned, depositors]."
          items:
            type: array
            items: {}
            minItems: 5
            maxItems: 5

    VaultDepositor:
      type: object
      required:
        - address
        - deposited
        - current_equity
        - share_percentage
        - pnl
        - deposited_since
      properties:
        address:
          type: string
          description: Depositor's account ID.
        deposited:
          type: string
          description: Total USD deposited (decimal string).
        current_equity:
          type: string
          description: Current value (shares * share_price).
        share_percentage:
          type: string
          description: Percentage of vault owned (decimal string).
        pnl:
          type: string
          description: Profit/loss (current_equity + withdrawn - deposited).
        deposited_since:
          type: integer
          format: int64
          description: First deposit timestamp in milliseconds.

    VaultDepositorsResponse:
      type: object
      required: [depositors, count, limit, offset]
      properties:
        depositors:
          type: array
          items:
            $ref: "#/components/schemas/VaultDepositor"
        count:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    VaultHistoryEntry:
      type: object
      required: [id, type, vault_id, status, timestamp]
      properties:
        id:
          type: string
          description: Unique ID (deposit_id or withdrawal_id).
        type:
          type: string
          enum: ["deposit", "withdrawal"]
        vault_id:
          type: string
          format: uuid
        vault_name:
          type: string
          nullable: true
          description: Vault display name (may be null for old records).
        account_id:
          type: string
          description: Account ID of the depositor/withdrawer. Present in public vault history.
        status:
          type: string
          enum: ["completed", "pending", "cancelled", "failed"]
        timestamp:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds.
        usd_amount:
          type: string
          nullable: true
          description: Amount deposited in USD (deposit only).
        shares_minted:
          type: string
          nullable: true
          description: Shares received from deposit (deposit only).
        shares_burned:
          type: string
          nullable: true
          description: Shares being withdrawn (withdrawal only).
        estimated_usd:
          type: string
          nullable: true
          description: Estimated USD at request time (withdrawal only).
        actual_usd:
          type: string
          nullable: true
          description: Actual USD received after fees (withdrawal only, when completed).
        share_price:
          type: string
          nullable: true
          description: Share price at deposit/withdrawal request.
        execution_share_price:
          type: string
          nullable: true
          description: Share price at withdrawal execution (withdrawal only).
        execute_at_timestamp:
          type: integer
          format: int64
          nullable: true
          description: When withdrawal can be executed (withdrawal only).
        executed_timestamp:
          type: integer
          format: int64
          nullable: true
          description: When withdrawal was executed (withdrawal only).

    VaultHistoryResponse:
      type: object
      required: [history, count, limit, offset]
      properties:
        history:
          type: array
          items:
            $ref: "#/components/schemas/VaultHistoryEntry"
        count:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    UserVaultPositionResponse:
      type: object
      required:
        - vault_id
        - shares
        - shares_locked
        - available_shares
        - total_deposited
        - total_withdrawn
        - avg_entry_price
        - current_value
        - net_contribution
        - unrealized_pnl
        - total_pnl
      properties:
        vault_id:
          type: string
          format: uuid
        shares:
          type: string
          description: Total shares owned (decimal string).
        shares_locked:
          type: string
          description: Shares locked for pending withdrawals.
        available_shares:
          type: string
          description: Shares available for withdrawal.
        total_deposited:
          type: string
          description: Cumulative USD deposited.
        total_withdrawn:
          type: string
          description: Cumulative USD withdrawn.
        avg_entry_price:
          type: string
          description: Weighted average share price at deposits.
        current_value:
          type: string
          description: Current value (shares * share_price).
        net_contribution:
          type: string
          description: Net contribution (deposited - withdrawn).
        unrealized_pnl:
          type: string
          description: Unrealised PnL (current_value - net_contribution).
        total_pnl:
          type: string
          description: Total PnL (current_value + withdrawn - deposited).

    UserVaultPositionsResponse:
      type: object
      required: [positions]
      properties:
        positions:
          type: array
          items:
            $ref: "#/components/schemas/UserVaultPositionResponse"

    MyDepositsHistoryResponse:
      type: object
      required: [history]
      properties:
        history:
          type: array
          description: "Time-series data: each element is [timestamp, equity, pnl]."
          items:
            type: array
            items: {}
            minItems: 3
            maxItems: 3

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  # =========================================================================
  # Public Endpoints
  # =========================================================================

  /v2/vaults:
    get:
      operationId: getVaults
      tags: [Vaults (Public)]
      summary: List all vaults
      description: >
        Returns a paginated list of vaults with optional filters.
        Portfolio metrics (APR, PnL, returns) are included for each vault.
      parameters:
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/OffsetQuery"
        - $ref: "#/components/parameters/PeriodQuery"
        - name: leader_account_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by vault leader account ID.
        - name: depositor_account_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by account that has deposited (holds shares > 0).
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: ["user", "protocol"]
          description: Filter by vault type.
        - name: is_verified
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
          description: Filter by verification status.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: ["active", "paused", "closed"]
            default: "active"
          description: Filter by vault status.
      responses:
        "200":
          description: Vault list with portfolio metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultListResponse"
        "400":
          description: Invalid query parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v2/vault/{id}:
    get:
      operationId: getVault
      tags: [Vaults (Public)]
      summary: Get single vault info
      description: Returns detailed information about a specific vault.
      parameters:
        - $ref: "#/components/parameters/VaultIdPath"
      responses:
        "200":
          description: Vault info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultInfoResponse"
        "404":
          description: Vault not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v2/vault/{id}/history:
    get:
      operationId: getVaultHistory
      tags: [Vaults (Public)]
      summary: Get vault deposit/withdrawal history
      description: Returns all deposits and withdrawals for a vault with pagination and optional filters.
      parameters:
        - $ref: "#/components/parameters/VaultIdPath"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/OffsetQuery"
        - $ref: "#/components/parameters/HistoryTypeQuery"
        - $ref: "#/components/parameters/HistoryStatusQuery"
      responses:
        "200":
          description: Vault history entries.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      vault_id:
                        type: string
                        format: uuid
                  - $ref: "#/components/schemas/VaultHistoryResponse"
        "400":
          description: Invalid query parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Vault not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v2/vault/{id}/portfolio:
    get:
      operationId: getVaultPortfolio
      tags: [Vaults (Public)]
      summary: Get vault portfolio metrics
      description: >
        Returns vault performance metrics including TVL, APR, PnL, Sharpe ratio,
        max drawdown, and historical time-series data.
      parameters:
        - $ref: "#/components/parameters/VaultIdPath"
        - $ref: "#/components/parameters/PeriodQuery"
      responses:
        "200":
          description: Vault portfolio with time-series history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultPortfolioResponse"
        "400":
          description: Invalid period parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Vault not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v2/vault/{id}/depositors:
    get:
      operationId: getVaultDepositors
      tags: [Vaults (Public)]
      summary: List vault depositors
      description: Returns all depositors in a vault with their equity, share percentage, and PnL.
      parameters:
        - $ref: "#/components/parameters/VaultIdPath"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/OffsetQuery"
      responses:
        "200":
          description: Depositor list with pagination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultDepositorsResponse"
        "400":
          description: Invalid query parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Vault not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # =========================================================================
  # Authenticated Endpoints
  # =========================================================================

  /v2/vault/position:
    get:
      operationId: getVaultPosition
      tags: [Vaults (Authenticated)]
      summary: Get user's position in a vault
      description: Returns the authenticated user's share holdings and PnL for a specific vault.
      security:
        - ApiWalletAuth: []
      parameters:
        - name: vault_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Vault UUID to query position for.
      responses:
        "200":
          description: User's vault position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserVaultPositionResponse"
        "400":
          description: Missing vault_id parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized — missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Vault not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v2/vault/positions:
    get:
      operationId: getAllVaultPositions
      tags: [Vaults (Authenticated)]
      summary: Get all user's vault positions
      description: Returns all vault positions for the authenticated user.
      security:
        - ApiWalletAuth: []
      responses:
        "200":
          description: List of all vault positions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserVaultPositionsResponse"
        "401":
          description: Unauthorized — missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v2/vault/history:
    get:
      operationId: getUserVaultHistory
      tags: [Vaults (Authenticated)]
      summary: Get user's vault deposit/withdrawal history
      description: >
        Returns the authenticated user's own deposit and withdrawal history
        across all vaults, with optional filters.
      security:
        - ApiWalletAuth: []
      parameters:
        - $ref: "#/components/parameters/VaultIdQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/OffsetQuery"
        - $ref: "#/components/parameters/HistoryTypeQuery"
        - $ref: "#/components/parameters/HistoryStatusQuery"
      responses:
        "200":
          description: User's vault history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultHistoryResponse"
        "400":
          description: Invalid query parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized — missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v2/vault/my-deposits/history:
    get:
      operationId: getMyDepositsHistory
      tags: [Vaults (Authenticated)]
      summary: Get user's equity history across vaults
      description: >
        Returns time-series data of the user's total equity and PnL across
        all vault deposits. Optionally filtered to a single vault.
      security:
        - ApiWalletAuth: []
      parameters:
        - $ref: "#/components/parameters/VaultIdQuery"
      responses:
        "200":
          description: Equity history time-series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyDepositsHistoryResponse"
        "401":
          description: Unauthorized — missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
