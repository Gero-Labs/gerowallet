paths:
  /v2/order:
    post:
      tags:
        - Orders
      summary: Create new order
      description: |
        Create a new order. Supports the following order types:

        | Type | Description |
        |------|-------------|
        | `limit` | Limit order at specified price |
        | `market` | Market order at best available price |
        | `stop` | Stop market order triggered at stop_price |
        | `stop_limit` | Stop limit order triggered at stop_price |
        | `take_profit` | Take profit market order |
        | `take_profit_limit` | Take profit limit order |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              limit_order:
                summary: Limit buy order
                value:
                  symbol: BTC-USD
                  side: buy
                  type: limit
                  size: '0.1'
                  price: '50000.00'
                  time_in_force: GTC
              market_order:
                summary: Market sell order
                value:
                  symbol: BTC-USD
                  side: sell
                  type: market
                  size: '0.1'
              stop_order:
                summary: Stop loss order
                value:
                  symbol: BTC-USD
                  side: sell
                  type: stop
                  size: '0.1'
                  stop_price: '48000.00'
                  reduce_only: true
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
          x-gitbook-description-html: <p>Order created successfully</p>
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
