  /v2/order/replace-batch:
    post:
      tags:
        - Orders
      summary: Replace batch orders
      description: >
        Replace multiple orders in a single request. Each replacement is an
        atomic cancel + create pair. If any individual cancel fails, the entire
        batch is aborted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceBatchOrdersRequest'
            examples:
              replace_batch:
                summary: Replace multiple limit orders
                value:
                  replacements:
                    - cancel:
                        order_id: 123456
                        symbol: BTC-USD
                      new_order:
                        symbol: BTC-USD
                        side: buy
                        type: limit
                        size: '0.1'
                        price: '49500.00'
                    - cancel:
                        order_id: 123457
                        symbol: BTC-USD
                      new_order:
                        symbol: BTC-USD
                        side: sell
                        type: limit
                        size: '0.1'
                        price: '51500.00'
      responses:
        '200':
          description: Batch replacement complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceBatchOrdersResponse'
          x-gitbook-description-html: <p>Batch replacement complete</p>
        '400':
