security:
  - ApiWalletAuth: []
components:
  securitySchemes:
    ApiWalletAuth:
      type: apiKey
      in: header
      name: X-API-Wallet-Public-Key
      description: >
        Ed25519 signature-based authentication using API Wallets.


        **Required Headers:**

        - `X-API-Wallet-Public-Key`: Your Ed25519 public key (64 hex characters)

        - `X-API-Wallet-Signature`: Ed25519 signature of the message (128 hex
        characters)

        - `X-API-Wallet-Timestamp`: Unix timestamp in seconds

        - `X-API-Wallet-Nonce`: Unique UUID v4 per request


        **Signature Message Format:**

        ```

        {METHOD}:{PATH}:{TIMESTAMP}:{NONCE}:{BODY_HASH}

        ```
      x-gitbook-description-html: >-
        <p>Ed25519 signature-based authentication using API Wallets.</p>

        <p><strong>Required Headers:</strong></p>

        <ul>

        <li><code>X-API-Wallet-Public-Key</code>: Your Ed25519 public key (64
        hex characters)</li>

        <li><code>X-API-Wallet-Signature</code>: Ed25519 signature of the
        message (128 hex characters)</li>

        <li><code>X-API-Wallet-Timestamp</code>: Unix timestamp in seconds</li>

        <li><code>X-API-Wallet-Nonce</code>: Unique UUID v4 per request</li>

        </ul>

        <p><strong>Signature Message Format:</strong></p>

        <pre><code>{METHOD}:{PATH}:{TIMESTAMP}:{NONCE}:{BODY_HASH}

        </code></pre>
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
          x-gitbook-description-html: <p>Error message</p>
        code:
          type: string
          description: Error code
          x-gitbook-description-html: <p>Error code</p>
        msg:
          type: string
          description: Error message (alternative format)
          x-gitbook-description-html: <p>Error message (alternative format)</p>
      required:
        - error
    CreateOrderRequest:
      type: object
      required:
        - symbol
        - side
        - type
        - size
      properties:
        client_order_id:
          type: string
          description: Client-provided order ID for tracking
          example: my-order-001
          x-gitbook-description-html: <p>Client-provided order ID for tracking</p>
        symbol:
          type: string
          description: Trading pair symbol
          example: BTC-USD
          x-gitbook-description-html: <p>Trading pair symbol</p>
        side:
          type: string
          enum:
            - buy
            - sell
          description: Order side
          example: buy
          x-gitbook-description-html: <p>Order side</p>
        type:
          type: string
          enum:
            - limit
            - market
            - stop
            - stop_limit
            - take_profit
            - take_profit_limit
          description: Order type
          example: limit
          x-gitbook-description-html: <p>Order type</p>
        size:
          type: string
          description: Order size in base asset
          example: '0.1'
          x-gitbook-description-html: <p>Order size in base asset</p>
        price:
          type: string
          description: Order price (required for limit orders)
          example: '50000.00'
          x-gitbook-description-html: <p>Order price (required for limit orders)</p>
        stop_price:
          type: string
          description: Trigger price for conditional orders
          example: '49500.00'
          x-gitbook-description-html: <p>Trigger price for conditional orders</p>
        time_in_force:
          type: string
          enum:
            - GTC
            - IOC
            - FOK
          default: GTC
          description: |
            Time in force:
            - GTC: Good Till Cancel
            - IOC: Immediate Or Cancel
            - FOK: Fill Or Kill
          example: GTC
          x-gitbook-description-html: |-
            <p>Time in force:</p>
            <ul>
            <li>GTC: Good Till Cancel</li>
            <li>IOC: Immediate Or Cancel</li>
            <li>FOK: Fill Or Kill</li>
            </ul>
        working_type:
          type: string
          enum:
            - mark_price
            - contract_price
          default: mark_price
          description: Price type for trigger evaluation
          x-gitbook-description-html: <p>Price type for trigger evaluation</p>
        post_only:
