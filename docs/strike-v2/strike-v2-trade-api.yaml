      summary: Replace order
      description: >
        Atomically cancel an existing order and create a new one. The cancel is
        executed first; if it fails, the new order is not created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceOrderRequest'
            examples:
              replace_limit:
                summary: Replace a limit order with new price
                value:
                  cancel:
                    order_id: 123456
                    symbol: BTC-USD
                  new_order:
                    symbol: BTC-USD
                    side: buy
                    type: limit
                    size: '0.1'
                    price: '49500.00'
