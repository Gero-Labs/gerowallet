  /v2/orders/batch:
    post:
      tags:
        - Orders
      summary: Create batch orders
      description: >
        Create multiple orders in a single request. Each order is processed
        independently — some may succeed while others fail. The response always
        returns HTTP 200 with both successful and failed results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatchOrdersRequest'
            examples:
              batch_limit_orders:
                summary: Multiple limit orders
                value:
                  orders:
                    - symbol: BTC-USD
                      side: buy
                      type: limit
                      size: '0.1'
                      price: '49000.00'
                    - symbol: BTC-USD
                      side: buy
                      type: limit
                      size: '0.1'
                      price: '48000.00'
      responses:
