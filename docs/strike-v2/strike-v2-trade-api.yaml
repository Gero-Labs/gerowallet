  /v2/order/strategy:
    post:
      tags:
        - Orders
      summary: Create strategy order (bracket order)
      description: >
        Create a strategy order with optional take-profit (TP) and stop-loss
        (SL) orders.


        **Requirements:**

        - At least one of `tp_order` or `sl_order` must be provided

        - The primary order executes first

        - TP/SL orders are placed when the primary order fills

        - If one TP/SL triggers, the other is automatically canceled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStrategyOrderRequest'
            examples:
              bracket_order:
                summary: Long position with TP and SL
                value:
                  strategy_id: strategy-001
                  client_order_id: entry-001
                  symbol: BTC-USD
                  side: buy
                  type: limit
                  size: '0.1'
                  price: '50000.00'
                  tp_order:
                    type: take_profit
                    size: '0.1'
                    stop_price: '55000.00'
                  sl_order:
                    type: stop
                    size: '0.1'
                    stop_price: '48000.00'
      responses:
