          description: Unique account identifier
          example: 01234567-89ab-cdef-0123-456789abcdef
          x-gitbook-description-html: <p>Unique account identifier</p>
        blockchain:
          type: string
          description: Blockchain the account is registered on
          example: cardano
          x-gitbook-description-html: <p>Blockchain the account is registered on</p>
        blockchain_address:
          type: string
          description: On-chain wallet address
          example: addr1qx...
          x-gitbook-description-html: <p>On-chain wallet address</p>
        wallet_balance:
          type: string
          description: Total wallet balance (USDT)
          example: '10000.00'
          x-gitbook-description-html: <p>Total wallet balance (USDT)</p>
        available_balance:
          type: string
          description: Balance available for new orders
          example: '7500.00'
          x-gitbook-description-html: <p>Balance available for new orders</p>
        unrealized_pnl:
          type: string
          description: Total unrealized PnL across all positions
          example: '250.50'
          x-gitbook-description-html: <p>Total unrealized PnL across all positions</p>
        margin_balance:
          type: string
