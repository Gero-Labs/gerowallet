components:
  schemas:
    PingResponse:
      type: object
      description: Empty JSON object. Confirms the API is reachable.
      x-gitbook-description-html: <p>Empty JSON object. Confirms the API is reachable.</p>
    TimeResponse:
      type: object
      properties:
        serverTime:
          type: integer
          format: int64
          description: Current server time (Unix milliseconds).
          x-gitbook-description-html: <p>Current server time (Unix milliseconds).</p>
    FeeTiersResponse:
      type: object
      properties:
        feeTiers:
          type: array
          items:
            $ref: "#/components/schemas/FeeTier"
          description: List of fee tiers sorted by ascending volume threshold.
          x-gitbook-description-html: <p>List of fee tiers sorted by ascending volume threshold.</p>
    FeeTier:
      type: object
      properties:
        tier:
          type: integer
          description: Tier number (0 = base tier).
          x-gitbook-description-html: <p>Tier number (0 = base tier).</p>
        minVolume:
          type: number
          description: Minimum 30-day trailing volume (USD) to qualify.
          x-gitbook-description-html: <p>Minimum 30-day trailing volume (USD) to qualify.</p>
        takerRate:
          type: number
          description: Taker fee rate as a decimal (e.g. `0.0005` = 0.05 %).
          x-gitbook-description-html: >-
            <p>Taker fee rate as a decimal (e.g. <code>0.0005</code> = 0.05
            %).</p>
        makerRate:
          type: number
          description: Maker fee rate as a decimal (e.g. `0.0002` = 0.02 %).
          x-gitbook-description-html: >-
            <p>Maker fee rate as a decimal (e.g. <code>0.0002</code> = 0.02
            %).</p>
