  /v2/fee-tiers:
    get:
      tags:
        - Fee Tiers
      summary: Fee Tiers
      description: >
        Returns the global fee tier schedule. Each tier specifies a minimum
        30-day trailing volume (USD) and the corresponding maker / taker fee
        rates.


        ### How fee tiers work


        Your fee tier is determined by your **trailing 30-day trading volume**
        (in USD). The highest tier whose `minVolume` threshold you meet is
        applied to all subsequent trades.


        | Field       | Type    | Description |

        |-------------|---------|-------------|

        | `tier`      | integer | Tier number (0 = base tier). |

        | `minVolume` | number  | Minimum 30-day volume (USD) to qualify for
        this tier. |

        | `takerRate` | number  | Taker fee rate (e.g. `0.0005` = 0.05 %). |

        | `makerRate` | number  | Maker fee rate (e.g. `0.0002` = 0.02 %). |


        > **Note:** Fee rates are expressed as decimals, not percentages.

        > Multiply by 100 to convert (e.g. `0.0005` → 0.05 %).
      responses:
        "200":
          description: Fee tier schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeTiersResponse"
              example:
                feeTiers:
                  - tier: 0
                    minVolume: 0
                    takerRate: 0.0005
                    makerRate: 0.0002
                  - tier: 1
                    minVolume: 1000000
                    takerRate: 0.00045
                    makerRate: 0.00015
                  - tier: 2
                    minVolume: 5000000
                    takerRate: 0.0004
                    makerRate: 0.0001
          x-gitbook-description-html: <p>Fee tier schedule</p>
